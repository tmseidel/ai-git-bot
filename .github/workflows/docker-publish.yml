name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      # Dry-run only: build + upload run without pushing anything to Docker Hub.
      - 'release/*'
    paths-ignore:
      - 'doc/**'

permissions:
  contents: read

env:
  IMAGE_NAME: tmseidel/ai-git-bot

jobs:
  # Resolved once and shared with the build/merge jobs so the version is not
  # extracted on every runner (the arm64 runner image ships a reduced toolset
  # and cannot be relied on to have Maven preinstalled).
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      dry_run: ${{ steps.mode.outputs.dry_run }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from pom.xml
        id: version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Detect dry-run mode
        id: mode
        run: |
          if [[ "$GITHUB_REF_NAME" == release/* ]]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

  # Each architecture is built natively on a matching runner and pushed
  # *by digest only* (no tags). Emulating arm64 via QEMU on an amd64 runner is
  # not viable for this image: it installs the .NET SDK, Go, Rust, Playwright
  # and Cypress, which takes hours under emulation.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Dry-runs (release/*) skip the registry login: nothing is pushed.
      - name: Log in to Docker Hub
        if: needs.prepare.outputs.dry_run == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prepare.outputs.version }}

      - name: Build image (dry-run, no push)
        if: needs.prepare.outputs.dry_run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          push: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Build and push image by digest
        if: needs.prepare.outputs.dry_run == 'false'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        if: needs.prepare.outputs.dry_run == 'false'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: needs.prepare.outputs.dry_run == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-architecture digests into a single multi-arch manifest list
  # and publish it under the real tags, so `docker pull` picks the right image
  # automatically on both amd64 and arm64 hosts. On release/* (dry-run) nothing
  # is pushed; the job only reports the tags it would have published.
  merge:
    name: Push multi-arch manifest
    runs-on: ubuntu-latest
    needs: [prepare, build]

    steps:
      - name: Download digests
        if: needs.prepare.outputs.dry_run == 'false'
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        if: needs.prepare.outputs.dry_run == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: needs.prepare.outputs.dry_run == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prepare.outputs.version }}

      - name: Dry-run notice (no push)
        if: needs.prepare.outputs.dry_run == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "DRY-RUN: release/* push - images were built but nothing is published."
          echo "Would create and push the multi-arch manifest list with these tags:"
          echo "$TAGS"

      - name: Create and push manifest list
        if: needs.prepare.outputs.dry_run == 'false'
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu

          # metadata-action emits one tag per line; tags never contain spaces,
          # so plain word splitting is safe here.
          tag_args=""
          for tag in $TAGS; do
            tag_args="$tag_args -t $tag"
          done

          # Word splitting on $tag_args and the digest list is intentional.
          # shellcheck disable=SC2086
          docker buildx imagetools create $tag_args \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect published image
        if: needs.prepare.outputs.dry_run == 'false'
        run: docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
