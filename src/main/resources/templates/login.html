<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="#{page.login.title} + ' - ' + #{app.name}">Login - AI Git Bot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}"/>
    <script th:src="@{/js/theme-init.js}"></script>
</head>
<body class="bg-body-tertiary">
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-end mb-2">
                        <div th:replace="~{fragments/locale-selector :: localeSelector('/login')}"></div>
                    </div>
                    <div class="text-center mb-4">
                        <img th:src="@{/images/favicon.png}" alt="AI Git Bot logo" width="64" height="64" class="mb-2 brand-icon"/>
                        <h3 class="mt-2" th:text="#{page.login.heading}">AI Git Bot</h3>
                        <p class="text-secondary" th:text="#{page.login.subtitle}">Sign in to manage your bots</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        <i class="bi bi-exclamation-triangle"></i> <span th:text="#{page.login.invalidCredentials}">Invalid username or password.</span>
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info" role="alert">
                        <i class="bi bi-box-arrow-right"></i> <span th:text="#{page.login.loggedOut}">You have been logged out.</span>
                    </div>
                    <div th:if="${success}" class="alert alert-success" role="alert">
                        <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label" th:text="#{page.login.username}">Username</label>
                            <input type="text" class="form-control" id="username" name="username"
                                   th:placeholder="#{page.login.usernamePlaceholder}" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label" th:text="#{page.login.password}">Password</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   th:placeholder="#{page.login.passwordPlaceholder}" required/>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me" value="true"/>
                            <label class="form-check-label" for="remember-me" th:text="#{page.login.rememberMe}">Remember me</label>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-box-arrow-in-right"></i> <span th:text="#{button.signIn}">Login</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
