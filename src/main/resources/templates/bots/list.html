<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(#{nav.bots}, ~{::pageContent})}">
<body>
    <div th:fragment="pageContent">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-cpu"></i> <span th:text="#{nav.bots}">Bots</span></h2>
            <a th:href="@{/bots/new}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> <span th:text="#{button.newBot}">New Bot</span>
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <div th:if="${#lists.isEmpty(bots)}" class="text-center py-4">
                    <i class="bi bi-inbox fs-1 text-secondary"></i>
                    <p class="text-secondary mt-2" th:text="#{message.noBots}">No bots configured yet.</p>
                    <a th:href="@{/bots/new}" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> <span th:text="#{button.createFirstBot}">Create your first bot</span>
                    </a>
                </div>
                <div th:if="${!#lists.isEmpty(bots)}" class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-group-divider">
                            <tr>
                                <th th:text="#{label.name}">Name</th>
                                <th th:text="#{label.username}">Username</th>
                                <th th:text="#{label.aiIntegration}">AI Integration</th>
                                 <th th:text="#{label.gitIntegration}">Git Integration</th>
                                 <th th:text="#{label.issueWorkflow}">Issue Workflow</th>
                                 <th th:text="#{label.enabled}">Enabled</th>
                                 <th th:text="#{label.webhookUrl}">Webhook URL</th>
                                <th th:text="#{label.actions}">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="bot : ${bots}">
                                <td th:text="${bot.name}"></td>
                                <td th:with="gitUsername=${gitUsernames[bot.gitIntegration.id]}">
                                    <span th:if="${gitUsername}" th:text="${gitUsername}"></span>
                                    <span th:unless="${gitUsername}" class="text-muted" th:title="#{help.git.usernameUnresolved}">&mdash;</span>
                                </td>
                                <td th:text="${bot.aiIntegration.name}"></td>
                                 <td th:text="${bot.gitIntegration.name}"></td>
                                 <td>
                                     <span th:if="${bot.issueWorkflowConfiguration != null}" class="badge bg-primary"
                                           th:text="${bot.issueWorkflowConfiguration.name}"></span>
                                     <span th:if="${bot.issueWorkflowConfiguration == null}" class="badge bg-secondary" th:text="#{label.none}">None</span>
                                 </td>
                                 <td>
                                     <span th:if="${bot.enabled}" class="badge bg-success" th:text="#{label.enabled}">Enabled</span>
                                     <span th:if="${!bot.enabled}" class="badge bg-secondary" th:text="#{label.disabled}">Disabled</span>
                                 </td>
                                 <td>
                                     <span th:if="${bot.webhookPath != null}" class="font-monospace small">
                                        <code th:text="${bot.webhookPath}"></code>
                                        <button type="button" class="btn btn-sm btn-link p-0 ms-1 copy-btn"
                                                th:data-copy="${bot.webhookPath}" th:title="#{button.copy}">
                                            <i class="bi bi-clipboard"></i>
                                        </button>
                                    </span>
                                    <span th:if="${bot.webhookPath == null}" class="text-secondary" th:text="#{label.notSet}">Not set</span>
                                </td>
                                <td>
                                    <div class="btn-group-with-gap btn-group-sm">
                                        <a th:href="@{/bots/{id}/edit(id=${bot.id})}"
                                           class="btn btn-outline-primary">
                                            <i class="bi bi-pencil"></i> <span th:text="#{button.edit}">Edit</span>
                                        </a>
                                        <form th:action="@{/bots/{id}/delete(id=${bot.id})}"
                                              method="post" class="d-inline"
                                              th:attr="onsubmit=|return confirm('#{message.confirmDeleteBot}')|">
                                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                                <i class="bi bi-trash"></i> <span th:text="#{button.delete}">Delete</span>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>


<script>
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.copy-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var webhookPath = this.getAttribute('data-copy');
                navigator.clipboard.writeText(webhookPath).then(function () {
                    btn.innerHTML = '<i class="bi bi-check"></i>';
                    setTimeout(function () { btn.innerHTML = '<i class="bi bi-clipboard"></i>'; }, 2000);
                });
            });
        });
    });
</script>
    </div>
</body>
</html>
