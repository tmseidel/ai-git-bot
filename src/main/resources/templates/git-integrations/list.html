<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(#{nav.gitIntegrations}, ~{::pageContent})}">
<body>
    <div th:fragment="pageContent">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-git"></i> <span th:text="#{nav.gitIntegrations}">Git Integrations</span></h2>
            <a th:href="@{/git-integrations/new}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> <span th:text="#{button.newIntegration}">New Integration</span>
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <div th:if="${#lists.isEmpty(integrations)}" class="text-center py-4">
                    <i class="bi bi-inbox fs-1 text-secondary"></i>
                    <p class="text-secondary mt-2" th:text="#{message.noGitIntegrations}">No Git integrations configured yet.</p>
                    <a th:href="@{/git-integrations/new}" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> <span th:text="#{button.addFirstGitIntegration}">Add your first Git integration</span>
                    </a>
                </div>
                <div th:if="${!#lists.isEmpty(integrations)}" class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-group-divider">
                            <tr>
                                <th th:text="#{label.name}">Name</th>
                                <th th:text="#{label.username}">Username</th>
                                <th th:text="#{label.providerType}">Provider Type</th>
                                <th th:text="#{label.url}">URL</th>
                                <th th:text="#{label.created}">Created</th>
                                <th th:text="#{label.actions}">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="integration : ${integrations}">
                                <td th:text="${integration.name}"></td>
                                <td th:text="${integration.username}"></td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${integration.providerType}"></span>
                                </td>
                                <td th:text="${integration.url}"></td>
                                <td>
                                    <span th:if="${integration.createdAt != null}"
                                          th:text="${#temporals.format(integration.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                                </td>
                                <td>
                                    <div class="btn-group-with-gap btn-group-sm">
                                        <a th:href="@{/git-integrations/{id}/edit(id=${integration.id})}"
                                           class="btn btn-outline-primary">
                                            <i class="bi bi-pencil"></i> <span th:text="#{button.edit}">Edit</span>
                                        </a>
                                        <form th:action="@{/git-integrations/{id}/delete(id=${integration.id})}"
                                              method="post" class="d-inline"
                                              th:attr="onsubmit=|return confirm('#{message.confirmDeleteGitIntegration}')|">
                                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                                <i class="bi bi-trash"></i> <span th:text="#{button.delete}">Delete</span>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
