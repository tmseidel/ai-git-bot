<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(#{nav.reviewQuality}, ~{::pageContent})}">
<body>
<div th:fragment="pageContent" id="reviewQualityPage">
    <style th:replace="~{reviews/fragments :: styles}"></style>
    <style th:replace="~{review-quality/fragments :: styles}"></style>
    <div th:replace="~{review-quality/fragments :: header('overview')}"></div>
    <form th:replace="~{review-quality/fragments :: filters('/review-quality', false)}"></form>

    <div th:replace="~{review-quality/fragments :: kpis(${view.kpis})}"></div>
    <div class="row g-3">
        <div class="col-lg-8">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <h5 class="mb-0" th:text="#{reviewQuality.overview.trend}">Findings per reviewed PR</h5>
                    <div class="btn-group btn-group-sm" role="group" th:aria-label="#{reviewQuality.overview.normalise}">
                        <input type="radio" class="btn-check" name="trendNorm" id="trendPerPr" value="pr" checked/>
                        <label class="btn btn-outline-secondary" for="trendPerPr" th:text="#{reviewQuality.overview.perPr}">per PR</label>
                        <input type="radio" class="btn-check" name="trendNorm" id="trendPerKloc" value="kloc"/>
                        <label class="btn btn-outline-secondary" for="trendPerKloc" th:text="#{reviewQuality.overview.perKloc}">per 1k changed lines</label>
                    </div>
                </div>
                <div class="card-body">
                    <div class="chart-box"><canvas id="trendChart"></canvas></div>
                    <div class="src mt-2" th:text="#{reviewQuality.overview.trendSource}">First review of each PR only.</div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-header"><h5 class="mb-0" th:text="#{reviewQuality.overview.conclusions}">Review conclusions</h5></div>
                <div class="card-body">
                    <div class="chart-box"><canvas id="conclusionChart"></canvas></div>
                    <div class="src mt-2" th:text="#{reviewQuality.overview.conclusionsSource}">All agentic reviews of the period.</div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{review-quality/fragments :: notes(${view.notes})}"></div>

    <div th:replace="~{review-quality/fragments :: definitions}"></div>
    <th:block th:replace="~{review-quality/fragments :: scripts}"></th:block>
</div>
</body>
</html>
