<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layoutWithExtras(${mcpConfiguration.id != null ? #messages.msg('page.mcpConfiguration.editTitle') : #messages.msg('page.mcpConfiguration.newTitle')}, ~{::pageContent}, ~{::extraHead}, ~{::extraScripts})}">
<head>
    <th:block th:fragment="extraHead">
        <!-- CodeMirror 6 injects its styles via JS; no extra CSS link required. -->
    </th:block>
</head>
<body>
    <div th:fragment="pageContent">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>
                <i class="bi bi-diagram-3"></i>
                <span th:if="${mcpConfiguration.id != null}" th:text="#{page.mcpConfiguration.editTitle}">Edit MCP Configuration</span>
                <span th:if="${mcpConfiguration.id == null}" th:text="#{page.mcpConfiguration.newTitle}">New MCP Configuration</span>
            </h2>
            <a th:if="${mcpConfiguration.id != null}"
               th:href="@{/system-settings/mcp-configurations/{id}/tools(id=${mcpConfiguration.id})}"
               class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-tools"></i> <span th:text="#{button.selectTools}">Select tools</span>
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <form th:action="@{/system-settings/mcp-configurations/save}" method="post" th:object="${mcpConfiguration}">
                    <input type="hidden" th:if="${mcpConfiguration.id != null}" th:field="*{id}"/>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label" th:text="#{label.name}">Name</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}"
                                   th:placeholder="#{placeholder.mcpName}" placeholder="e.g. GitHub MCP" required/>
                        </div>

                        <div class="col-12">
                            <div class="d-flex justify-content-between align-items-center">
                                <label for="jsonContent" class="form-label" th:text="#{label.mcpJson}">MCP JSON</label>
                                <button type="button" id="jsonContentFormatBtn" class="btn btn-sm btn-outline-secondary">
                                    <i class="bi bi-code-slash"></i> Format JSON
                                </button>
                            </div>
                            <textarea class="form-control font-monospace invisible" id="jsonContent" th:field="*{jsonContent}"
                                      rows="14" required
                                      placeholder='{"name":"github","type":"url","url":"https://example.com/mcp"}'></textarea>
                            <div class="form-text" th:utext="#{help.mcp.description}">
                                Enter a remote/network MCP configuration. Local <code>stdio</code> transports are rejected.<br/>
                                See <a href="https://github.com/tmseidel/ai-git-bot/blob/main/doc/MCP_SERVER_HANDLING.md" target="_blank">doc/MCP_SERVER_HANDLING.md</a> for examples.
                            </div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> <span th:text="#{button.saveAndSelectTools}">Save and select tools</span>
                        </button>
                        <a th:href="@{/system-settings}" class="btn btn-secondary ms-2">
                            <i class="bi bi-x-lg"></i> <span th:text="#{button.cancel}">Cancel</span>
                        </a>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <th:block th:fragment="extraScripts">
        <script type="module">
            import { initJsonEditor } from /*[[@{/js/json-editor.js}]]*/ '/js/json-editor.js';
            // The textarea starts invisible so it does not flash before the editor replaces it.
            const textarea = document.getElementById('jsonContent');
            initJsonEditor(textarea, {
                formatButton: document.getElementById('jsonContentFormatBtn'),
                // Match the (invisible, but laid out) textarea so the content below does not
                // shift when the editor replaces it; minHeight applies inside the editor's 1px border.
                minHeight: (textarea.offsetHeight - 2) + 'px'
            });
        </script>
    </th:block>
</body>
</html>
