# Workflow names
workflow.review.name=PR Review
workflow.agentic-review.name=Agentic PR Review
workflow.unit-test-author.name=AI Unit Tests
workflow.readme-sync.name=README Sync
workflow.i18n-coverage.name=i18n Coverage
workflow.issue-triage.name=Issue Triage
workflow.issue-coding.name=Coding Agent
workflow.issue-writer.name=Writer Agent
workflow.e2e-test.name=E2E Tests
workflow.review.description=Posts an AI code review as a single PR comment whenever a pull request is opened or updated, responds to @-mentions and inline review comments with conversational follow-ups, and optionally approves or requests changes based on the bot's configured post-review action.
workflow.agentic-review.description=Reviews the pull request with an LLM that can iteratively call read-only repository and MCP tools to gather context before writing its findings as a Markdown comment.
workflow.i18n-coverage.description=Detects when a pull request's i18n changes (added keys, changed values, deleted keys) are not consistently reflected across locale files, then drafts the missing translations per locale with an LLM agent against a configurable baseline locale and posts a short summary. Supports messages_*.properties and i18n/*.json files.
workflow.unit-test-author.description=Generates white-box unit tests for the pull-request diff, runs them with the project's own test runner, and (optionally) commits the passing tests onto the PR branch. Works on a checkout of the PR head — no preview deployment needed.
workflow.e2e-test.description=Deploys a preview of the pull request to its configured deployment target, then generates and runs end-to-end tests against the live preview and posts a Markdown summary. Requires a deployment target; supports re-run / regenerate slash commands.
workflow.readme-sync.description=Detects when a pull request's code changes have made the project's Markdown documentation inaccurate or outdated, then updates, creates or removes the relevant docs (within the configured scope) with an LLM agent and posts a short summary. Markdown-only; changed files are constrained to the configured patterns.
workflow.issue-writer.description=Refines the assigned issue into a well-specified, testable issue with the writer agent and answers follow-up questions in issue comments.
workflow.issue-coding.description=Implements the assigned issue with the coding agent (workspace, branch and pull request) and continues the implementation on follow-up issue comments.
workflow.issue-triage.description=Routes a new or newly assigned issue to the right assignee (person, bot, or none) with an agent that gathers repository/issue context before deciding, posts the routing reason as a comment, and performs the assignment. Never implements the issue itself.
