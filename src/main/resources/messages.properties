help.bot.systemPrompt=Select the prompt set used for code reviews, coding-agent implementations, and writer-agent workflows.
help.bot.mcpConfiguration=Optional remote MCP tools. Only selected tools are exposed to the prompt.
help.bot.toolConfiguration=Whitelist of built-in agent tools (file, context, validation, repository) that this bot may expose to the AI. Only enabled tools are advertised to the model and executable at runtime.
help.bot.workflowConfiguration=Which workflows run on pull-request webhooks (reviews, test generation, ...). Leave empty to inherit the default (review-only). Select the empty "No PR workflows" configuration to keep the bot silent on PRs.
help.bot.runOnPrCreation=When enabled, the bot executes its configured PR workflow when a pull request is created or opened, even if the bot is not assigned as reviewer.
help.bot.runOnPrUpdate=When enabled, the bot executes its configured PR workflow on every <code>synchronized</code> event (new commits pushed to the PR branch). Supported on GitHub and Gitea only. Existing installations default to off.
help.bot.issueWorkflow=What this bot does when it is assigned to an issue, and how it handles follow-up issue comments (e.g. Coding Agent implements the issue, Writer Agent refines it). Independent from the PR workflow configuration above.
help.bot.runOnIssueCreation=When enabled, the bot executes its configured issue-assigned workflow when an issue is created, even if the bot is not assigned to the issue.
help.bot.deploymentTarget=Per-PR preview environment used by workflows that need a live deployment (e.g. E2E tests). Manage targets under
help.bot.userWhitelist=Git usernames allowed to trigger AI-spending interactions with this bot (PR opens/syncs, <code>@</code>-mentions, inline comments, agent issue work). One username per line or comma-separated; matching is case-insensitive. <strong>Leave blank to allow everyone</strong> (historical default). Recommended for <strong>public repositories</strong> so unknown users cannot burn the bot's AI tokens.
help.bot.webhookSigningSecret=When set, the bot verifies the provider's webhook signature (<code>X-Hub-Signature-256</code> for GitHub, <code>X-Gitea-Signature</code> for Gitea, <code>X-Gitlab-Token</code> for GitLab, <code>X-Hub-Signature</code> for Bitbucket) and rejects forged events. Configure the same secret in the provider's webhook settings. Stored encrypted when <code>APP_ENCRYPTION_KEY</code> is configured. <strong>Highly recommended for public repositories.</strong>
help.bot.aiIntegrationMissing=<strong>AI Integration</strong> — connects the bot to an AI provider (Anthropic, OpenAI, Google, ...).
help.bot.gitIntegrationMissing=<strong>Git Integration</strong> — connects the bot to a Git platform (Gitea, GitHub, GitLab, ...).
popover.toolCalling.title=Tool calling mode
popover.toolCalling.content=<p><strong>On (default, recommended)</strong>: tool descriptors are sent through the provider's native function-calling API (Anthropic <code>tools</code>, OpenAI/Ollama <code>tool_calls</code>, Google <code>functionDeclarations</code>). The model returns structured tool invocations that the agent loop dispatches directly. This is the recommended route for frontier models — it is more token-efficient and more reliable in agentic workflows.</p><p><strong>Off (legacy fallback)</strong>: the tool catalogue is described inside the system prompt and the model is asked to reply with a JSON block the agent parses itself. Only fall back to this if native tool calling does not work reliably in your agentic workflows — e.g. with weaker / smaller models or some self-hosted backends.</p><p>llama.cpp always runs in legacy mode regardless of this switch. See <code>doc/TOOL_CALLING.md</code> for the full troubleshooting playbook.</p>
popover.promptCaching.title=Prompt caching
popover.promptCaching.content=<p><strong>On (default, recommended)</strong>: the client marks cache breakpoints on the system prompt and on the rolling tail of the conversation. Agentic workflows re-send the whole prompt prefix (system prompt + diff + all previous tool results) on every round; with caching, repeated prefixes are billed as cache reads at roughly 1/10 of the input price instead of full price, cutting review cost to a fraction.</p><p><strong>Off</strong>: every request is billed at full input price. Only turn this off if your provider endpoint rejects the <code>cache_control</code> field.</p><p>Currently only the Anthropic provider supports prompt caching; other providers ignore this switch.</p>
help.ai.contextWindow=Model's total context window size. Used for proactive history compaction.
help.ai.toolCalling=Recommended for frontier models — native function calling is the default and the most token-efficient, reliable route in agentic workflows. Only turn this off to fall back to the legacy JSON-in-prompt tooling if native tool calling misbehaves (e.g. with weaker models or some self-hosted backends).
help.ai.promptCaching=Anthropic Claude only — cached prompt prefixes are billed at a much lower rate, which substantially reduces the cost of agentic reviews. Ignored by providers without a caching API.
