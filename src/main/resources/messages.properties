reviewQuality.def.counting=Counting rules
reviewQuality.def.finalized=Only agentic reviews with a finalized record count; failed, cancelled and abandoned runs appear only in "Review conclusions". Withdrawn findings never count.
reviewQuality.def.pr=A PR is counted per Git integration, bot, repository and number, in the period of its first finalized review. Finding figures use that first review, so a PR reviewed five times weighs as much as one reviewed once.
reviewQuality.def.feedback=Feedback counts the effective record per reviewer and target; superseded and retracted records are history.
reviewQuality.def.sample=Every rate shows its numerator and denominator on hover; below {0} items it shows "–" instead of a misleading percentage.
reviewQuality.def.resolution=Resolved, persisting and new
reviewQuality.def.matching=When a review is finalized, each finding is matched against the previous review of the same PR: same file, and titles that share at least half of their words — or the same category, nearby lines and some shared words. A heuristic, not proof that the same problem was meant.
reviewQuality.def.cost=Cost and return
reviewQuality.def.costText=Cost is the token usage of agentic-review runs (reviews and follow-up answers). Each AI interaction's cost is computed with its AI integration's token prices when it is recorded and stored, so a later price change, model switch or rename never changes past cost. The return is an estimate from the assumptions on the Cost tab.
reviewQuality.def.notShown=Deliberately not shown
reviewQuality.def.noScore=A single "code quality score": findings depend on the model, the prompt, the lessons and the diff size, and one number would hide that.
reviewQuality.def.noRanking=Per-author rankings: the author table is opt-in, sorted by name and never compared with a team average.
reviewQuality.def.utc=Periods and buckets are in UTC; weeks start on Monday.
flash.aiPricesInvalid=Token prices must be empty or a number of at least 0.
