# Workflow param field descriptions
workflow.review.param.maxDiffCharsPerChunk.description=Maximum characters per diff chunk before splitting. The full PR diff is split into chunks of this size for review.
workflow.review.param.maxDiffChunks.description=Maximum number of diff chunks to review. Further chunks beyond this limit are skipped.
workflow.review.param.retryTruncatedChunkChars.description=When a chunk is too large for the model's context window (prompt-too-long error), the chunk is truncated to this many characters and retried once.
workflow.review.param.excludedFilePatterns.description=Comma-separated glob or filename patterns for files to exclude from the review diff (e.g. *.lock, *.min.js, package-lock.json, **/generated/**). Matching file sections are stripped before the diff is sent to the AI, reducing token usage and noise. Leave blank to review all files.
workflow.agentic-review.param.maxToolRounds.description=Upper bound on how many explore/answer rounds the agent may take.
workflow.agentic-review.param.enableFormalReviewDecision.description=When enabled, the bot may post a formal PR review decision.
workflow.agentic-review.param.formalReviewDecisionPrompt.description=Criteria the model uses to classify findings by severity.
workflow.agentic-review.param.blockerThreshold.description=Maximum allowed BLOCKER findings for a formal APPROVE. Leave empty to ignore.
workflow.agentic-review.param.mediumThreshold.description=Maximum allowed MEDIUM findings for a formal APPROVE. Leave empty to ignore.
workflow.agentic-review.param.lowThreshold.description=Maximum allowed LOW findings for a formal APPROVE. Leave empty to ignore.
workflow.e2e-test.param.framework.description=playwright (default, well-tested) — pytest, k6, cypress are experimental and only smoke-tested.
workflow.e2e-test.param.maxRetries.description=Per-test retry budget. A test that passes after retries is tagged FLAKY.
workflow.e2e-test.param.maxTestCases.description=Cost guard — capped at a hard maximum regardless of the configured value.
workflow.e2e-test.param.suiteLifecycle.description=What happens to the generated suite after the PR closes.
workflow.e2e-test.param.promotionThresholdPercent.description=Minimum percentage of executed test cases that must pass for the suite to be promoted (applies to offer-as-pr / commit-to-pr / promote-on-merge). 100 (default) means only fully green suites are promoted; lower it to e.g. 80 to also promote when at least 80% of the tests pass. Suites that ERROR or are SKIPPED are never promoted regardless of this value. Tip: LLM-generated tests are rarely 100% runnable on the first try — treat them as a regression-test baseline, not as ground truth.
workflow.i18n-coverage.param.includedFilePatterns.description=Newline- or comma-separated glob patterns identifying the i18n locale files. These patterns define BOTH the files the workflow inspects AND the files it is allowed to create/update/delete. Only locale files (*.properties / *.json) are ever produced. Globs support ** (any path segments), * (within a segment) and ?. Examples: messages_*.properties, i18n/*.json.
workflow.i18n-coverage.param.baselineLocale.description=Optional. The reference locale whose keys/values/deletions the other locale files are compared against (e.g. en, en_US). Every non-baseline locale file that is missing baseline keys gets drafted translations; keys the baseline no longer defines are removed. Leave blank to auto-detect the baseline per bundle family — the implicit-default (suffix-less) file such as messages.properties is used when present, otherwise the first locale file. A blank value is saved as-is and will not revert to a default.
workflow.i18n-coverage.param.maxToolRounds.description=Upper bound on how many explore/write rounds the agent may take. Higher values allow larger translation updates at higher token cost.
workflow.i18n-coverage.param.suiteLifecycle.description=What to do with the generated translation changes.
workflow.readme-sync.param.includedFilePatterns.description=Newline- or comma-separated glob patterns defining the documentation scope. These patterns define BOTH the documentation the workflow reads AND the files it is allowed to create/update/delete. Only Markdown files (*.md / *.markdown) are ever produced. Globs support ** (any path segments), * (within a segment) and ?. Translated variants (e.g. README.de.md) are included when covered by a pattern such as README.*.md.
workflow.readme-sync.param.maxToolRounds.description=Upper bound on how many explore/write rounds the agent may take. Higher values allow larger documentation updates at higher token cost.
workflow.readme-sync.param.suiteLifecycle.description=What to do with the generated documentation changes.
workflow.unit-test-author.param.framework.description=Leave on auto to detect the toolchain from the repository, or pin it explicitly.
workflow.unit-test-author.param.maxRetries.description=How many times to re-run a failing suite before reporting it failed (0-5).
workflow.unit-test-author.param.maxTestCases.description=Cost guard — capped at a hard maximum regardless of the value.
workflow.unit-test-author.param.suiteLifecycle.description=What to do with the generated tests.
workflow.issue-triage.param.systemPrompt.description=Routing instructions for the triage model. MUST be reviewed before use: check role descriptions, account names and bot names, and make sure every listed account exists and is assignable in the connected Git provider. Keep the account names in sync with the allowed assignees below.
workflow.issue-triage.param.assignees.description=Comma-separated account names the workflow may assign issues to. 'none' is always allowed and means: post the reason but leave the issue unassigned.
workflow.e2e-test.param.framework.option.playwright.description=Node.js — default, well-tested.
workflow.e2e-test.param.framework.option.pytest.description=Python — experimental.
