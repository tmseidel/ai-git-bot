help.deploymentTarget.callbackUrl=Asynchronous strategies (e.g. <code>WEBHOOK</code>) must call back to the bot on this URL when the preview environment is ready. The <code>{runId}</code> and <code>{secret}</code> placeholders are filled in per request and embedded in the outbound webhook payload as <code>callbackUrl</code>.
help.deploymentTarget.publicBaseUrl=Set the <code>ai-git-bot.public-base-url</code> property (e.g. <code>https://bot.acme.io</code>) so the bot can hand out a fully-qualified URL.
help.deploymentTarget.name=Unique identifier shown in the bot form dropdown.
help.deploymentTarget.previewUrlTemplate=Optional. Required by <code>STATIC</code>; informational for <code>WEBHOOK</code>. Placeholders: <code>{prNumber}</code>, <code>{sha}</code>, <code>{branch}</code>.
help.deploymentTarget.timeout=Maximum time the orchestrator waits for the strategy / callback.
help.deploymentTarget.strategyConfig=<strong>WEBHOOK</strong>: <code>{ "webhookUrl": "&lt;url&gt;", "sharedSecret": "&lt;hex&gt;", "headers": { ... } }</code>.<br/><strong>STATIC</strong>: <code>{ "healthcheckPath": "/healthz", "expectedStatus": 200, "intervalSeconds": 5, "extraHeaders": { ... } }</code>.<br/><strong>MCP</strong> <em>(experimental)</em>: <code>{ "mcpConfigurationId": &lt;id&gt;, "deployTool": "&lt;qualified-name&gt;", "statusTool": "&lt;qualified-name&gt;", "teardownTool": "&lt;qualified-name&gt;", "argsTemplate": { "branch": "{branch}", "sha": "{sha}" } }</code>. All tool names must be whitelisted on the referenced MCP configuration — the save is rejected otherwise.<br/><strong>CI_ACTION</strong>: <code>{ "workflowRef": "preview.yml", "refTemplate": "refs/heads/{branch}", "previewUrlOutput": "preview_url", "pollIntervalSeconds": 15, "inputs": { "callbackUrl": "{callbackUrl}" } }</code>. <code>workflowRef</code> is the workflow file (GitHub / Gitea Actions), the pipeline trigger token (GitLab CI) or the custom pipeline pattern (Bitbucket Pipelines). <code>refTemplate</code> must resolve to a <em>branch or tag</em> that already exists on the remote (default: <code>refs/heads/{branch}</code>) — Gitea, GitLab and Bitbucket reject pull-request refs such as <code>refs/pull/N/head</code> at dispatch time. GitHub Actions additionally supports <code>refs/pull/{prNumber}/head</code> (needed for fork PRs). See <a href="https://github.com/tmseidel/ai-git-bot/blob/main/doc/PR_WORKFLOWS_CI_ACTIONS.md" target="_blank">doc/PR_WORKFLOWS_CI_ACTIONS.md</a> for one recipe per provider.<br/>See <a href="https://github.com/tmseidel/ai-git-bot/blob/main/doc/PR_WORKFLOWS.md" target="_blank">doc/PR_WORKFLOWS.md → Deployment targets</a> for the full schema.
