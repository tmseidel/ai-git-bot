# Workflow param field descriptions
workflow.review.param.maxDiffCharsPerChunk.description=分割前每个 diff 块的最大字符数。完整的 PR diff 会按此大小拆分为多个块以供审查。
workflow.review.param.maxDiffChunks.description=要审查的 diff 块的最大数量。超过此上限的块将被跳过。
workflow.review.param.retryTruncatedChunkChars.description=当某个块超出模型的上下文窗口（提示词过长错误）时，会将其截断到该字符数并重试一次。
workflow.review.param.excludedFilePatterns.description=以逗号分隔的 glob 或文件名模式，用于从审查 diff 中排除文件（例如 *.lock、*.min.js、package-lock.json、**/generated/**）。匹配的文件部分会在发送给 AI 之前被剥离，从而减少 token 消耗和噪声。留空则审查所有文件。
workflow.agentic-review.param.maxToolRounds.description=代理可执行的探索/回答轮数的上限。
workflow.agentic-review.param.enableFormalReviewDecision.description=启用后，机器人可发布正式的 PR 审查决定。
workflow.agentic-review.param.formalReviewDecisionPrompt.description=模型用于按严重程度对发现进行分类的标准。
workflow.agentic-review.param.blockerThreshold.description=正式批准所允许的 BLOCKER（阻断）问题的最大数量。留空则忽略。
workflow.agentic-review.param.mediumThreshold.description=正式批准所允许的 MEDIUM（中等）问题的最大数量。留空则忽略。
workflow.agentic-review.param.lowThreshold.description=正式批准所允许的 LOW（轻微）问题的最大数量。留空则忽略。
workflow.e2e-test.param.framework.description=playwright（默认，经过充分测试）— pytest、k6、cypress 为实验性，仅经过冒烟测试。
workflow.e2e-test.param.maxRetries.description=每个测试的重试预算。重试后通过的测试会被标记为 FLAKY。
workflow.e2e-test.param.maxTestCases.description=成本保护 — 无论配置值如何，都会限制在硬性上限。
workflow.e2e-test.param.suiteLifecycle.description=PR 关闭后如何处理生成的套件。
workflow.e2e-test.param.promotionThresholdPercent.description=套件晋升所需的最低已执行测试用例通过百分比（适用于 offer-as-pr / commit-to-pr / promote-on-merge）。100（默认）表示只有完全通过的套件才会晋升；可将其降低到例如 80，以在至少 80% 测试通过时也进行晋升。无论此值如何，出现 ERROR 或 SKIPPED 的套件都不会晋升。提示：LLM 生成的测试很少在首次就 100% 可运行——请将其视为回归测试基线，而非绝对事实。
workflow.i18n-coverage.param.includedFilePatterns.description=以换行或逗号分隔的 glob 模式，用于标识 i18n 语言文件。这些模式同时定义了工作流检查的文件和允许创建/更新/删除的文件。只会生成语言文件（*.properties / *.json）。glob 支持 **（任意路径段）、*（段内）和 ?。示例：messages_*.properties、i18n/*.json。
workflow.i18n-coverage.param.baselineLocale.description=可选。其他语言文件与之比较键/值/删除的参考语言（例如 en、en_US）。每个缺少基准键的非基准语言文件都会获得起草的翻译；基准不再定义的键会被删除。留空则按 bundle 系列自动检测基准——若存在 messages.properties 之类的隐式默认（无后缀）文件则使用它，否则使用第一个语言文件。空值按原样保存，不会回退到默认值。
workflow.i18n-coverage.param.maxToolRounds.description=代理可执行的探索/写入轮数的上限。值越大，可进行的翻译更新越大，但 token 成本也越高。
workflow.i18n-coverage.param.suiteLifecycle.description=如何处理生成的翻译变更。
workflow.readme-sync.param.includedFilePatterns.description=以换行或逗号分隔的 glob 模式，用于定义文档范围。这些模式同时定义了工作流读取的文档和允许创建/更新/删除的文件。只会生成 Markdown 文件（*.md / *.markdown）。glob 支持 **（任意路径段）、*（段内）和 ?。翻译变体（如 README.de.md）在被 README.*.md 之类的模式覆盖时会被包含。
workflow.readme-sync.param.maxToolRounds.description=代理可执行的探索/写入轮数的上限。值越大，可进行的文档更新越大，但 token 成本也越高。
workflow.readme-sync.param.suiteLifecycle.description=如何处理生成的文档变更。
workflow.unit-test-author.param.framework.description=保持 auto 以从仓库自动检测工具链，或明确指定。
workflow.unit-test-author.param.maxRetries.description=在将失败的套件报告为失败之前重新运行的次数（0-5）。
workflow.unit-test-author.param.maxTestCases.description=成本保护 — 无论值如何，都会限制在硬性上限。
workflow.unit-test-author.param.suiteLifecycle.description=如何处理生成的测试。
workflow.issue-triage.param.systemPrompt.description=分诊模型的路由指令。使用前必须审阅：检查角色描述、账户名和机器人名，并确保列出的每个账户在连接的 Git 提供商中存在且可分配。保持账户名与下方允许的负责人同步。
workflow.issue-triage.param.assignees.description=工作流可将议题分配给的以逗号分隔的账户名。始终允许使用 none，表示发布原因但保持议题未分配。
