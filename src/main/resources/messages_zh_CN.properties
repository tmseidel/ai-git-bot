help.prompt.reviewAgentInfo=由<strong>智能体 PR 审查</strong>工作流使用。仅编辑代理的<strong>角色描述</strong>——只读的工具协议（可用工具和调用约定）由软件追加，此处<strong>不可</strong>编辑。
help.prompt.e2ePlannerInfo=由全栈 QA 工作流使用。仅编辑代理的<strong>角色描述</strong>——技术协议（活动框架、JSON 输出模式、工具名称和调用顺序、URL 约定）始终由软件追加，此处<strong>不可</strong>编辑，因此编辑不会破坏流水线。
