help.deploymentTarget.callbackUrl=异步策略（例如 <code>WEBHOOK</code>）必须在预览环境就绪时通过此 URL 回调机器人。<code>{runId}</code> 和 <code>{secret}</code> 占位符按请求填充，并作为 <code>callbackUrl</code> 嵌入出站 webhook 载荷中。
help.deploymentTarget.publicBaseUrl=设置 <code>ai-git-bot.public-base-url</code> 属性（例如 <code>https://bot.acme.io</code>），以便机器人能够提供完全限定的 URL。
help.deploymentTarget.name=在机器人表单下拉框中显示的唯一标识符。
help.deploymentTarget.previewUrlTemplate=可选。<code>STATIC</code> 必需；<code>WEBHOOK</code> 为参考信息。占位符：<code>{prNumber}</code>、<code>{sha}</code>、<code>{branch}</code>。
help.deploymentTarget.timeout=编排器等待策略/回调的最长时间。
help.deploymentTarget.strategyConfig=<strong>WEBHOOK</strong>：<code>{ "webhookUrl": "&lt;url&gt;", "sharedSecret": "&lt;hex&gt;", "headers": { ... } }</code>。<br/><strong>STATIC</strong>：<code>{ "healthcheckPath": "/healthz", "expectedStatus": 200, "intervalSeconds": 5, "extraHeaders": { ... } }</code>。<br/><strong>MCP</strong> <em>（实验性）</em>：<code>{ "mcpConfigurationId": &lt;id&gt;, "deployTool": "&lt;限定名&gt;", "statusTool": "&lt;限定名&gt;", "teardownTool": "&lt;限定名&gt;", "argsTemplate": { "branch": "{branch}", "sha": "{sha}" } }</code>。所有工具名称都必须在所引用的 MCP 配置中列入白名单——否则保存将被拒绝。<br/><strong>CI_ACTION</strong>：<code>{ "workflowRef": "preview.yml", "refTemplate": "refs/heads/{branch}", "previewUrlOutput": "preview_url", "pollIntervalSeconds": 15, "inputs": { "callbackUrl": "{callbackUrl}" } }</code>。<code>workflowRef</code> 是工作流文件（GitHub / Gitea Actions）、流水线触发令牌（GitLab CI）或自定义流水线模式（Bitbucket Pipelines）。<code>refTemplate</code> 必须解析为远程上已存在的<em>分支或标签</em>（默认：<code>refs/heads/{branch}</code>）——Gitea、GitLab 和 Bitbucket 在派发时会拒绝 <code>refs/pull/N/head</code> 之类的拉取请求引用。GitHub Actions 还支持 <code>refs/pull/{prNumber}/head</code>（fork PR 需要）。每个提供商的配方请参阅 <a href="https://github.com/tmseidel/ai-git-bot/blob/main/doc/PR_WORKFLOWS_CI_ACTIONS.md" target="_blank">doc/PR_WORKFLOWS_CI_ACTIONS.md</a>。<br/>完整模式请参阅 <a href="https://github.com/tmseidel/ai-git-bot/blob/main/doc/PR_WORKFLOWS.md" target="_blank">doc/PR_WORKFLOWS.md → Deployment targets</a>。
