help.bot.systemPrompt=选择用于代码审查、编码代理实现和写作代理工作流的提示词集。
help.bot.mcpConfiguration=可选的远程 MCP 工具。仅向提示词公开选定的工具。
help.bot.toolConfiguration=此机器人可向 AI 公开的内置代理工具（文件、上下文、验证、仓库）白名单。仅启用的工具会告知模型并可在运行时执行。
help.bot.workflowConfiguration=在拉取请求 Webhook 上运行哪些工作流（审查、测试生成等）。留空则继承默认值（仅审查）。选择空的「No PR workflows」配置可使机器人对 PR 保持静默。
help.bot.runOnPrCreation=启用后，当拉取请求被创建或打开时，机器人会执行其配置的 PR 工作流，即使未被分配为审查者。
help.bot.runOnPrUpdate=启用后，机器人会在每次 <code>synchronized</code> 事件（向 PR 分支推送新提交）时执行其配置的 PR 工作流。仅支持 GitHub 和 Gitea。现有安装默认关闭。
help.bot.issueWorkflow=此机器人被分配议题时的行为，以及如何处理后续议题评论（如编码代理实现、写作代理细化）。与上述 PR 工作流配置相互独立。
help.bot.runOnIssueCreation=启用后，当创建议题时，机器人会执行其配置的议题工作流，即使未被分配给该议题。
help.bot.deploymentTarget=需要实时部署的工作流（如 E2E 测试）所使用的每个 PR 的预览环境。请在以下位置管理目标：
help.bot.userWhitelist=允许触发与此机器人进行付费 AI 交互的 Git 用户名（PR 打开/同步、<code>@</code>提及、内联评论、代理议题工作）。每行一个用户名或以逗号分隔；匹配不区分大小写。<strong>留空则允许所有人</strong>（历史默认值）。建议用于<strong>公共仓库</strong>，以免未知用户消耗机器人的 AI token。
help.bot.webhookSigningSecret=设置后，机器人会验证提供商的 webhook 签名（GitHub 为 <code>X-Hub-Signature-256</code>，Gitea 为 <code>X-Gitea-Signature</code>，GitLab 为 <code>X-Gitlab-Token</code>，Bitbucket 为 <code>X-Hub-Signature</code>）并拒绝伪造事件。在提供商的 webhook 设置中配置相同的密钥。配置 <code>APP_ENCRYPTION_KEY</code> 后会加密存储。<strong>强烈建议用于公共仓库。</strong>
help.bot.aiIntegrationMissing=<strong>AI 集成</strong> — 将机器人连接到 AI 提供商（Anthropic、OpenAI、Google 等）。
help.bot.gitIntegrationMissing=<strong>Git 集成</strong> — 将机器人连接到 Git 平台（Gitea、GitHub、GitLab 等）。
popover.toolCalling.title=工具调用模式
popover.toolCalling.content=<p><strong>开启（默认，推荐）</strong>：工具描述符通过提供商的原生函数调用 API 发送（Anthropic <code>tools</code>、OpenAI/Ollama <code>tool_calls</code>、Google <code>functionDeclarations</code>）。模型返回结构化的工具调用，由代理循环直接分发。这是前沿模型的推荐方式——更节省 token，且在智能体工作流中更可靠。</p><p><strong>关闭（旧版回退）</strong>：工具目录在系统提示词中描述，模型被要求用一个 JSON 块回复，由代理自行解析。仅当原生工具调用在你的智能体工作流中无法可靠工作时才回退到此方式——例如较弱的/较小的模型或某些自托管后端。</p><p>无论此开关如何，llama.cpp 始终以旧版模式运行。完整的故障排查手册请参阅 <code>doc/TOOL_CALLING.md</code>。</p>
popover.promptCaching.title=提示词缓存
popover.promptCaching.content=<p><strong>开启（默认，推荐）</strong>：客户端在系统提示词和对话的滚动尾部标记缓存断点。智能体工作流每轮都会重新发送整个提示词前缀（系统提示词 + diff + 所有先前的工具结果）；启用缓存后，重复的前缀按约输入价格 1/10 的缓存读取计费，而非全价，从而将审查成本降至一小部分。</p><p><strong>关闭</strong>：每个请求都按全价输入计费。仅当提供商端点拒绝 <code>cache_control</code> 字段时才关闭此项。</p><p>目前仅 Anthropic 提供商支持提示词缓存；其他提供商会忽略此开关。</p>
help.ai.contextWindow=模型的总上下文窗口大小。用于主动压缩历史记录。
help.ai.toolCalling=推荐用于前沿模型——原生函数调用是默认方式，也是智能体工作流中最节省 token、最可靠的途径。仅当原生工具调用出现问题时（例如较弱的模型或某些自托管后端）才关闭此项以回退到旧的 JSON-in-prompt 方式。
help.ai.promptCaching=仅 Anthropic Claude —— 缓存的提示词前缀按低得多的费率计费，可大幅降低智能体审查成本。没有缓存 API 的提供商会忽略此设置。
