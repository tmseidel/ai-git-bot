# Workflow names
workflow.review.name=PR 审查
workflow.agentic-review.name=智能体 PR 审查
workflow.unit-test-author.name=AI 单元测试
workflow.readme-sync.name=README 同步
workflow.i18n-coverage.name=i18n 覆盖
workflow.issue-triage.name=议题分诊
workflow.issue-coding.name=编码代理
workflow.issue-writer.name=写作代理
workflow.e2e-test.name=E2E 测试
workflow.review.description=在拉取请求打开或更新时将 AI 代码审查作为单个 PR 评论发布，以对话方式回应 @提及和内联审查评论，并根据配置的审查后操作选择批准或要求更改。
workflow.agentic-review.description=使用可迭代调用只读仓库和 MCP 工具收集上下文的 LLM 审查拉取请求，并将发现以 Markdown 评论形式写出。
workflow.i18n-coverage.description=检测拉取请求的 i18n 变更（新增、修改、删除的键）是否未一致地反映在各语言文件中，然后由 LLM 代理对照可配置的基准语言起草缺失的翻译并发布简短摘要。支持 messages_*.properties 和 i18n/*.json 文件。
workflow.unit-test-author.description=为拉取请求的差异生成白盒单元测试，使用项目自身的测试运行器执行，并可选择将通过的测试提交到 PR 分支。基于 PR 头部的检出工作，无需预览部署。
workflow.e2e-test.description=将拉取请求的预览部署到其配置的部署目标，然后针对实时预览生成并运行端到端测试，并发布 Markdown 摘要。需要部署目标；支持 re-run / regenerate 斜杠命令。
workflow.readme-sync.description=检测拉取请求的代码变更是否导致项目的 Markdown 文档不准确或过时，然后由 LLM 代理在配置的范围内更新、创建或删除相关文档并发布简短摘要。仅限 Markdown；更改的文件受配置的模式约束。
workflow.issue-writer.description=由写作代理将分配的议题细化为规范明确、可测试的议题，并在议题评论中回答后续问题。
workflow.issue-coding.description=由编码代理实现分配的议题（工作区、分支和拉取请求），并在后续议题评论中继续实现。
workflow.issue-triage.description=由代理将新议题或新分配的议题路由给正确的负责人（人、机器人或无），在决定前收集仓库/议题上下文，将路由原因作为评论发布并执行分配。绝不实现议题本身。
