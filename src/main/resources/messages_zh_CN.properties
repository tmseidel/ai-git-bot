help.mcp.description=输入远程/网络 MCP 配置。本地 <code>stdio</code> 传输会被拒绝。
help.botTools.defaultInfo=这是<strong>默认</strong>工具配置。它始终包含所有已注册的内置工具，且无法重命名或删除。其工具选择会自动管理；要限制向机器人公开的工具，请创建新的配置。
