# Workflow names
workflow.review.name=Revue de PR
workflow.agentic-review.name=Revue de PR par agent
workflow.unit-test-author.name=Tests unitaires IA
workflow.readme-sync.name=Synchronisation README
workflow.i18n-coverage.name=Couverture i18n
workflow.issue-triage.name=Triage des issues
workflow.issue-coding.name=Agent de codage
workflow.issue-writer.name=Agent rédacteur
workflow.e2e-test.name=Tests E2E
workflow.review.description=Publie une revue de code IA sous forme d'un commentaire de PR unique à l'ouverture ou à la mise à jour d'une pull request, répond aux @-mentions et aux commentaires de revue en ligne par des suivis conversationnels, et approuve ou demande des modifications selon l'action post-revue configurée.
workflow.agentic-review.description=Examine la pull request avec un LLM capable d'appeler itérativement des outils de dépôt en lecture seule et des outils MCP pour rassembler le contexte avant de rédiger ses constats sous forme de commentaire Markdown.
workflow.i18n-coverage.description=Détecte quand les changements i18n d'une pull request (clés ajoutées, valeurs modifiées, clés supprimées) ne sont pas reflétés de façon cohérente dans les fichiers de locale, puis rédige les traductions manquantes par locale avec un agent LLM à partir d'une locale de référence configurable et publie un court résumé. Prend en charge les fichiers messages_*.properties et i18n/*.json.
workflow.unit-test-author.description=Génère des tests unitaires boîte blanche pour le diff de la pull request, les exécute avec le lanceur de tests du projet et (facultativement) commite les tests réussis sur la branche de la PR. Fonctionne sur un checkout du HEAD de la PR — aucun déploiement d'aperçu nécessaire.
workflow.e2e-test.description=Déploie un aperçu de la pull request vers sa cible de déploiement configurée, génère et exécute ensuite des tests de bout en bout contre l'aperçu en direct et publie un résumé Markdown. Nécessite une cible de déploiement ; prend en charge les commandes slash re-run / regenerate.
workflow.readme-sync.description=Détecte quand les changements de code d'une pull request ont rendu la documentation Markdown du projet inexacte ou obsolète, puis met à jour, crée ou supprime les documents concernés (dans le périmètre configuré) avec un agent LLM et publie un court résumé. Markdown uniquement ; les fichiers modifiés sont limités aux motifs configurés.
workflow.issue-writer.description=Affine l'issue assignée en une issue bien spécifiée et testable avec l'agent rédacteur et répond aux questions de suivi dans les commentaires d'issue.
workflow.issue-coding.description=Implémente l'issue assignée avec l'agent de codage (espace de travail, branche et pull request) et poursuit l'implémentation sur les commentaires d'issue suivants.
workflow.issue-triage.description=Achemine une issue nouvelle ou nouvellement assignée vers le bon destinataire (personne, bot ou aucun) avec un agent qui rassemble le contexte du dépôt/de l'issue avant de décider, publie la raison de l'acheminement en commentaire et effectue l'affectation. N'implémente jamais l'issue elle-même.
