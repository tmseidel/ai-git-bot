help.hook.name=Libellé lisible affiché dans la liste des endpoints.
help.hook.url=Doit commencer par <code>http://</code> ou <code>https://</code>. Les livraisons y sont POSTées avec un corps JSON ; toute réponse 2xx compte comme un succès.
help.hook.eventTypes=Au moins un. L'endpoint reçoit chaque événement coché correspondant à son périmètre ci-dessous.
help.hook.customHeaders=Envoyé avec chaque livraison. Doit être un objet JSON unique. Stocké chiffré lorsque APP_ENCRYPTION_KEY est configurée ; laissez vide à l'édition pour conserver la valeur actuelle.
help.hook.scope=Laissez les trois vides pour un endpoint global recevant les événements de tous les bots et dépôts.
help.hook.secret=Facultatif. Lorsqu'il est défini, les livraisons sont signées avec <code>X-EventHook-Signature-256</code>.
help.hook.keepSecret=Laissez vide pour conserver le secret actuel.
help.hook.authorizationHeader=Valeur d'en-tête <code>Authorization</code> statique facultative, ex. <code>Bearer token123456</code> ou <code>Basic YWxhZGRpbjpvcGVuc2VzYW1l</code>.
help.hook.keepValue=Laissez vide pour conserver la valeur actuelle.
help.hook.skipTls=Non sécurisé : désactive la validation du certificat HTTPS. À utiliser uniquement pour les endpoints auto-signés/internes.
help.git.urlDescription=L'URL de base de votre instance Gitea.
help.git.usernameUnresolved=Pas encore déterminé. Le nom d'utilisateur est lu auprès du fournisseur avec le jeton de l'intégration au démarrage, à l'enregistrement de l'intégration et au prochain événement webhook.
help.git.tokenRemoved=Le jeton stocké sera supprimé à l'enregistrement.
help.git.tokenDescription=Le jeton d'accès pour l'authentification API.
help.git.reviewTrigger=Les revues de code ne s'exécutent que lorsque le bot est explicitement demandé comme relecteur. Les nouveaux commits ne déclenchent pas automatiquement de revues de suivi.
