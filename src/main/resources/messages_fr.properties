help.botTools.defaultInfo=Ceci est la configuration d'outils <strong>par défaut</strong>. Elle contient toujours tous les outils intégrés enregistrés et ne peut être ni renommée ni supprimée. Sa sélection d'outils est gérée automatiquement ; créez une nouvelle configuration pour restreindre les outils exposés à un bot.
help.botTools.defaultSelectionInfo=La configuration d'outils <strong>par défaut</strong> contient toujours tous les outils intégrés enregistrés et est en lecture seule. Clonez-la pour créer un sous-ensemble personnalisé.
help.prompt.reviewAgentInfo=Utilisé par le workflow <strong>Revue de PR agentique</strong>. Modifiez uniquement la <strong>description du rôle</strong> de l'agent — le protocole d'outils en lecture seule (outils disponibles et conventions d'appel) est ajouté par le logiciel et n'est <strong>pas</strong> modifiable ici.
help.prompt.e2ePlannerInfo=Utilisé par le workflow QA full-stack. Modifiez uniquement la <strong>description du rôle</strong> de l'agent — le protocole technique (framework actif, schéma de sortie JSON, noms d'outils et séquence d'appels, conventions d'URL) est toujours ajouté par le logiciel et n'est <strong>pas</strong> modifiable ici, afin qu'une modification ne puisse pas casser le pipeline.
