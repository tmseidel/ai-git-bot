help.hook.name=Libellé lisible affiché dans la liste des endpoints.
help.hook.url=Doit commencer par <code>http://</code> ou <code>https://</code>. Les livraisons y sont POSTées avec un corps JSON ; toute réponse 2xx compte comme un succès.
help.hook.eventTypes=Au moins un. L'endpoint reçoit chaque événement coché correspondant à son périmètre ci-dessous.
help.hook.customHeaders=Envoyé avec chaque livraison. Doit être un objet JSON unique. Stocké chiffré lorsque <code>APP_ENCRYPTION_KEY</code> est configurée ; laissez vide à l'édition pour conserver la valeur actuelle.
help.hook.scope=Laissez les trois vides pour un endpoint global recevant les événements de tous les bots et dépôts.
help.hook.secret=Facultatif. Lorsqu'il est défini, les livraisons sont signées avec <code>X-EventHook-Signature-256</code>.
help.hook.keepSecret=Laissez vide pour conserver le secret actuel.
help.hook.authorizationHeader=Valeur d'en-tête <code>Authorization</code> statique facultative, ex. <code>Bearer token123456</code> ou <code>Basic YWxhZGRpbjpvcGVuc2VzYW1l</code>.
