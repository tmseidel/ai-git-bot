aiTest.tools.notCalled=Le modèle a répondu par du texte au lieu d’appeler l’outil de test. Les workflows d’agent risquent de ne pas fonctionner avec l’appel d’outils natif ; essayez un autre modèle ou désactivez l’appel d’outils natif.
aiTest.tools.wrongTool=Le modèle a appelé un outil inconnu « {0} » au lieu de l’outil de test. L’appel d’outils natif peut être peu fiable avec ce modèle.
aiTest.tools.rejected=Le fournisseur a refusé la requête avec outils (HTTP {0}). Le modèle ou le serveur ne prend probablement pas en charge l’appel d’outils natif ; désactivez-le pour cette intégration.
