reviewQuality.cost.title=Coût et rendement estimé
reviewQuality.cost.hint=Le coût est mesuré. Le rendement est une estimation fondée sur les hypothèses de gauche ; elles sont enregistrées pour toute l'installation et ne modifient jamais un chiffre mesuré.
reviewQuality.cost.assumptions=Hypothèses
reviewQuality.cost.minutesBlocker=Minutes gagnées par bloquant accepté
reviewQuality.cost.minutesMedium=… par constat moyen accepté
reviewQuality.cost.minutesLow=… par constat mineur accepté
reviewQuality.cost.minutesIncorrect=Minutes perdues par constat incorrect
reviewQuality.cost.hourlyRate=Coût horaire d'ingénierie
reviewQuality.cost.currency=Devise
reviewQuality.cost.accepted="Accepté" signifie résolu dans une revue ultérieure ou marqué utile ; les constats qui ne sont ni l'un ni l'autre ne comptent pas comme du temps gagné.
reviewQuality.cost.split=Revues : {0} · réponses de suivi et exécutions non liées : {1}
reviewQuality.cost.noPrices=Aucune utilisation de cette période n'a été enregistrée avec des prix de tokens, elle est donc affichée en tokens. Les prix renseignés dans une intégration IA s'appliquent à l'utilisation enregistrée à partir de ce moment.
reviewQuality.cost.unpriced={0} tokens ont été enregistrés alors que leur intégration IA n''avait pas de prix et ne sont pas inclus dans le coût.
reviewQuality.assumptions.saved=Les hypothèses ont été enregistrées.
reviewQuality.assumptions.invalid=Les hypothèses n'ont pas été enregistrées : les minutes doivent être comprises entre 0 et 100 000, le taux horaire ne doit pas être négatif et la devise doit avoir un code tel que USD ou EUR.
reviewQuality.since.fingerprints=Résolus / persistants / nouveaux est enregistré pour les revues depuis le {0}.
reviewQuality.since.fingerprints.none=Résolus / persistants / nouveaux est enregistré pour les revues finalisées à partir de maintenant.
reviewQuality.since.diffSize=Les tailles de diff sont enregistrées depuis le {0}.
reviewQuality.since.diffSize.none=Les tailles de diff sont enregistrées pour les revues à partir de maintenant.
reviewQuality.since.runLinks=Les revues sont liées à leur utilisation IA depuis le {0}.
reviewQuality.since.runLinks.none=Les revues sont liées à leur utilisation IA à partir de maintenant.
reviewQuality.since.outcomes=Les fusions et fermetures sont enregistrées depuis le {0}.
reviewQuality.since.outcomes.none=Les fusions et fermetures sont enregistrées à partir de maintenant.
reviewQuality.since.authors=Les auteurs de PR sont enregistrés depuis le {0}.
reviewQuality.since.authors.none=Les auteurs de PR sont enregistrés pour les revues à partir de maintenant.
reviewQuality.def.counting=Règles de comptage
reviewQuality.def.finalized=Seules les revues agentiques ayant un enregistrement finalisé comptent ; les exécutions échouées, annulées et abandonnées n'apparaissent que dans "Conclusions des revues". Les constats retirés ne comptent jamais.
reviewQuality.def.pr=Une PR est comptée par intégration Git, bot, dépôt et numéro, dans la période de sa première revue finalisée. Les chiffres sur les constats utilisent cette première revue : une PR revue cinq fois pèse autant qu'une PR revue une seule fois.
reviewQuality.def.feedback=Les retours comptent l'enregistrement en vigueur par relecteur et par cible ; les enregistrements remplacés et retirés relèvent de l'historique.
reviewQuality.def.sample=Chaque taux affiche son numérateur et son dénominateur au survol ; en dessous de {0} éléments, il affiche "–" au lieu d''un pourcentage trompeur.
reviewQuality.def.resolution=Résolus, persistants et nouveaux
reviewQuality.def.matching=Lorsqu'une revue est finalisée, chaque constat est rapproché de la revue précédente de la même PR : même fichier et titres partageant au moins la moitié de leurs mots — ou même catégorie, lignes proches et quelques mots en commun. Une heuristique, pas la preuve qu'il s'agit du même problème.
reviewQuality.def.cost=Coût et rendement
reviewQuality.def.costText=Le coût correspond à l'utilisation de tokens des exécutions de revue agentique (revues et réponses de suivi). Le coût de chaque interaction IA est calculé avec les prix des tokens de son intégration IA au moment de l'enregistrement et stocké ; un changement de prix, de modèle ou de nom ultérieur ne modifie jamais le coût passé. Le rendement est une estimation fondée sur les hypothèses de l'onglet Coût.
reviewQuality.def.notShown=Volontairement non affiché
reviewQuality.def.noScore=Un "score de qualité du code" unique : les constats dépendent du modèle, du prompt, des leçons et de la taille du diff, et un seul chiffre le masquerait.
reviewQuality.def.noRanking=Classements par auteur : le tableau des auteurs est facultatif (opt-in), trié par nom et jamais comparé à une moyenne d'équipe.
reviewQuality.def.utc=Les périodes et regroupements sont en UTC ; les semaines commencent le lundi.
flash.aiPricesInvalid=Les prix des jetons doivent être vides ou un nombre supérieur ou égal à 0.
