help.deploymentTarget.callbackUrl=Les stratégies asynchrones (ex. <code>WEBHOOK</code>) doivent rappeler le bot sur cette URL lorsque l'environnement d'aperçu est prêt. Les espaces réservés <code>{runId}</code> et <code>{secret}</code> sont remplis à chaque requête et intégrés dans la charge utile du webhook sortant sous <code>callbackUrl</code>.
help.deploymentTarget.publicBaseUrl=Définissez la propriété <code>ai-git-bot.public-base-url</code> (ex. <code>https://bot.acme.io</code>) pour que le bot puisse fournir une URL entièrement qualifiée.
help.deploymentTarget.name=Identifiant unique affiché dans la liste déroulante du formulaire de bot.
help.deploymentTarget.previewUrlTemplate=Facultatif. Requis par <code>STATIC</code> ; informatif pour <code>WEBHOOK</code>. Espaces réservés : <code>{prNumber}</code>, <code>{sha}</code>, <code>{branch}</code>.
help.deploymentTarget.timeout=Temps maximal pendant lequel l'orchestrateur attend la stratégie / le callback.
help.deploymentTarget.strategyConfig=<strong>WEBHOOK</strong> : <code>{ "webhookUrl": "&lt;url&gt;", "sharedSecret": "&lt;hex&gt;", "headers": { ... } }</code>.<br/><strong>STATIC</strong> : <code>{ "healthcheckPath": "/healthz", "expectedStatus": 200, "intervalSeconds": 5, "extraHeaders": { ... } }</code>.<br/><strong>MCP</strong> <em>(expérimental)</em> : <code>{ "mcpConfigurationId": &lt;id&gt;, "deployTool": "&lt;nom-qualifié&gt;", "statusTool": "&lt;nom-qualifié&gt;", "teardownTool": "&lt;nom-qualifié&gt;", "argsTemplate": { "branch": "{branch}", "sha": "{sha}" } }</code>. Tous les noms d'outils doivent être sur la liste blanche de la configuration MCP référencée — sinon l'enregistrement est rejeté.<br/><strong>CI_ACTION</strong> : <code>{ "workflowRef": "preview.yml", "refTemplate": "refs/heads/{branch}", "previewUrlOutput": "preview_url", "pollIntervalSeconds": 15, "inputs": { "callbackUrl": "{callbackUrl}" } }</code>. <code>workflowRef</code> est le fichier de workflow (GitHub / Gitea Actions), le jeton de déclenchement de pipeline (GitLab CI) ou le motif de pipeline personnalisé (Bitbucket Pipelines). <code>refTemplate</code> doit correspondre à une <em>branche ou un tag</em> existant déjà sur le dépôt distant (par défaut : <code>refs/heads/{branch}</code>) — Gitea, GitLab et Bitbucket rejettent les références de pull request telles que <code>refs/pull/N/head</code> au moment du déclenchement. GitHub Actions prend aussi en charge <code>refs/pull/{prNumber}/head</code> (nécessaire pour les PR de fork). Voir <a href="https://github.com/tmseidel/ai-git-bot/blob/main/doc/PR_WORKFLOWS_CI_ACTIONS.md" target="_blank">doc/PR_WORKFLOWS_CI_ACTIONS.md</a> pour une recette par fournisseur.<br/>Voir <a href="https://github.com/tmseidel/ai-git-bot/blob/main/doc/PR_WORKFLOWS.md" target="_blank">doc/PR_WORKFLOWS.md → Deployment targets</a> pour le schéma complet.
