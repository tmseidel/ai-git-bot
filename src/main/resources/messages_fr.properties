aiTest.error.modelMissing=Saisissez un modèle.
aiTest.error.apiUrlMissing=Saisissez une URL d’API.
aiTest.error.apiKeyMissing=Ce fournisseur exige une clé d’API. Saisissez-en une pour lancer le test.
aiTest.error.providerChangedNeedsKey=Le fournisseur a été modifié. Saisissez une clé d’API pour le nouveau fournisseur pour lancer le test.
aiTest.error.configuration=Paramètres invalides : {0}
aiTest.error.unauthorized=Le fournisseur a refusé la clé d’API (HTTP {0}). Vérifiez la clé et ses autorisations.
aiTest.error.notFound=Le fournisseur a renvoyé HTTP {0}. Vérifiez l’URL d’API et le nom du modèle.
aiTest.error.proxyAuth=Un proxy exige une authentification (HTTP {0}). Configurez les identifiants du proxy pour les connexions sortantes.
aiTest.error.rateLimited=Le fournisseur limite le débit de cette clé ou son quota est épuisé (HTTP {0}).
aiTest.error.serverError=Le fournisseur signale une erreur serveur (HTTP {0}). Réessayez plus tard.
aiTest.error.http=Le fournisseur a refusé la requête (HTTP {0}). Vérifiez le nom du modèle, les tokens maximum et la version d’API.
aiTest.error.unknownHost=Le nom d’hôte n’a pas pu être résolu : {0}. Vérifiez l’URL d’API et les paramètres DNS du serveur.
aiTest.error.tls=La connexion TLS a échoué : {0}. Le certificat est peut-être auto-signé, expiré ou remplacé par un proxy ; ajoutez l’AC au magasin de confiance.
aiTest.error.connectTimeout=Le délai de connexion a expiré avant que le serveur ne réponde. Un pare-feu ou un proxy bloque peut-être les connexions sortantes, ou l’URL d’API pointe vers le mauvais hôte ou port.
aiTest.error.readTimeout=Le serveur a accepté la connexion, mais le modèle n’a pas répondu à temps. Le modèle est peut-être encore en cours de chargement, le matériel est lent ou un modèle de raisonnement réfléchit longtemps. Relancez le test une fois le modèle chargé, ou augmentez HTTP_CLIENT_READ_TIMEOUT.
aiTest.error.connectionRefused=La connexion a été refusée ou l’hôte est injoignable. Vérifiez l’URL d’API, le port, ainsi que le pare-feu et le proxy.
aiTest.error.unexpected=Le test a échoué : {0}
