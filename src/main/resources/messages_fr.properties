# Workflow param field descriptions
workflow.review.param.maxDiffCharsPerChunk.description=Nombre maximal de caractères par bloc de diff avant découpage. Le diff complet de la PR est découpé en blocs de cette taille pour la revue.
workflow.review.param.maxDiffChunks.description=Nombre maximal de blocs de diff à examiner. Les blocs au-delà de cette limite sont ignorés.
workflow.review.param.retryTruncatedChunkChars.description=Lorsqu'un bloc est trop volumineux pour la fenêtre de contexte du modèle (erreur prompt trop long), le bloc est tronqué à ce nombre de caractères et retenté une fois.
workflow.review.param.excludedFilePatterns.description=Motifs glob ou de nom de fichier séparés par des virgules pour exclure des fichiers du diff de revue (ex. *.lock, *.min.js, package-lock.json, **/generated/**). Les sections correspondantes sont supprimées avant l'envoi du diff à l'IA, réduisant la consommation de jetons et le bruit. Laissez vide pour tout examiner.
workflow.agentic-review.param.maxToolRounds.description=Limite supérieure du nombre de tours d'exploration/réponse que l'agent peut effectuer.
workflow.agentic-review.param.enableFormalReviewDecision.description=Lorsqu'il est activé, le bot peut publier une décision de revue de PR formelle.
workflow.agentic-review.param.formalReviewDecisionPrompt.description=Critères utilisés par le modèle pour classer les constats par gravité.
workflow.agentic-review.param.blockerThreshold.description=Nombre maximal de constats BLOCKER autorisés pour une APPROBATION formelle. Laissez vide pour ignorer.
workflow.agentic-review.param.mediumThreshold.description=Nombre maximal de constats MOYENS autorisés pour une APPROBATION formelle. Laissez vide pour ignorer.
workflow.agentic-review.param.lowThreshold.description=Nombre maximal de constats FAIBLES autorisés pour une APPROBATION formelle. Laissez vide pour ignorer.
workflow.e2e-test.param.framework.description=playwright (par défaut, bien testé) — pytest, k6, cypress sont expérimentaux et seulement testés sommairement.
workflow.e2e-test.param.maxRetries.description=Budget de tentatives par test. Un test qui réussit après de nouvelles tentatives est marqué FLAKY.
workflow.e2e-test.param.maxTestCases.description=Garde-fou de coût — plafonné à un maximum absolu quelle que soit la valeur configurée.
workflow.e2e-test.param.suiteLifecycle.description=Ce qui arrive à la suite générée après la fermeture de la PR.
workflow.e2e-test.param.promotionThresholdPercent.description=Pourcentage minimal de cas de test exécutés devant réussir pour que la suite soit promue (s'applique à offer-as-pr / commit-to-pr / promote-on-merge). 100 (par défaut) signifie que seules les suites entièrement vertes sont promues ; abaissez-le à 80 pour promouvoir aussi lorsque 80 % des tests réussissent. Les suites en ERROR ou SKIPPED ne sont jamais promues, quelle que soit cette valeur. Astuce : les tests générés par LLM sont rarement 100 % exécutables du premier coup — traitez-les comme une base de tests de régression, pas comme une vérité absolue.
workflow.i18n-coverage.param.includedFilePatterns.description=Motifs glob séparés par des retours à la ligne ou des virgules identifiant les fichiers de locale i18n. Ces motifs définissent À LA FOIS les fichiers inspectés ET les fichiers autorisés à créer/modifier/supprimer. Seuls des fichiers de locale (*.properties / *.json) sont produits. Les globs prennent en charge ** (segments de chemin), * (dans un segment) et ?. Exemples : messages_*.properties, i18n/*.json.
workflow.i18n-coverage.param.baselineLocale.description=Facultatif. La locale de référence par rapport à laquelle les clés/valeurs/suppressions des autres fichiers de locale sont comparées (ex. en, en_US). Tout fichier non-baseline auquel il manque des clés reçoit des traductions ébauchées ; les clés que la baseline ne définit plus sont supprimées. Laissez vide pour détecter automatiquement la baseline par famille de bundles — le fichier implicite (sans suffixe) tel que messages.properties est utilisé s'il existe, sinon le premier fichier de locale. Une valeur vide est enregistrée telle quelle et ne reviendra pas à une valeur par défaut.
workflow.i18n-coverage.param.maxToolRounds.description=Limite supérieure du nombre de tours d'exploration/écriture que l'agent peut effectuer. Des valeurs plus élevées permettent des mises à jour de traduction plus importantes, au prix de plus de jetons.
workflow.i18n-coverage.param.suiteLifecycle.description=Que faire des changements de traduction générés.
workflow.readme-sync.param.includedFilePatterns.description=Motifs glob séparés par des retours à la ligne ou des virgules définissant le périmètre de la documentation. Ces motifs définissent À LA FOIS la documentation lue ET les fichiers autorisés à créer/modifier/supprimer. Seuls des fichiers Markdown (*.md / *.markdown) sont produits. Les globs prennent en charge ** (segments de chemin), * (dans un segment) et ?. Les variantes traduites (ex. README.de.md) sont incluses lorsqu'elles sont couvertes par un motif tel que README.*.md.
workflow.readme-sync.param.maxToolRounds.description=Limite supérieure du nombre de tours d'exploration/écriture que l'agent peut effectuer. Des valeurs plus élevées permettent des mises à jour de documentation plus importantes, au prix de plus de jetons.
workflow.readme-sync.param.suiteLifecycle.description=Que faire des changements de documentation générés.
workflow.unit-test-author.param.framework.description=Laissez sur auto pour détecter la chaîne d'outils depuis le dépôt, ou fixez-la explicitement.
workflow.unit-test-author.param.maxRetries.description=Combien de fois relancer une suite en échec avant de la déclarer en échec (0-5).
workflow.unit-test-author.param.maxTestCases.description=Garde-fou de coût — plafonné à un maximum absolu quelle que soit la valeur.
workflow.unit-test-author.param.suiteLifecycle.description=Que faire des tests générés.
workflow.issue-triage.param.systemPrompt.description=Instructions d'acheminement pour le modèle de triage. DOIT être relu avant utilisation : vérifiez les descriptions de rôles, les noms de comptes et de bots, et assurez-vous que chaque compte listé existe et est assignable dans le fournisseur Git connecté. Gardez les noms de comptes synchronisés avec les assignés autorisés ci-dessous.
workflow.issue-triage.param.assignees.description=Noms de comptes séparés par des virgules auxquels le workflow peut assigner des issues. « none » est toujours autorisé et signifie : publier la raison mais laisser l'issue non assignée.
