aiTest.connection.emptyMaxTokens=Le fournisseur a répondu, mais le modèle a épuisé ses tokens maximum avant de produire du texte. Augmentez les tokens maximum ; les modèles de raisonnement comptent leur réflexion dans cette limite.
aiTest.tools.ok=Le modèle a appelé l’outil de test. L’appel d’outils natif fonctionne.
