help.bot.systemPrompt=Sélectionnez l'ensemble de prompts utilisé pour les revues de code, les implémentations de l'agent de codage et les workflows de l'agent rédacteur.
help.bot.mcpConfiguration=Outils MCP distants facultatifs. Seuls les outils sélectionnés sont exposés au prompt.
help.bot.toolConfiguration=Liste blanche des outils d'agent intégrés (fichier, contexte, validation, dépôt) que ce bot peut exposer à l'IA. Seuls les outils activés sont annoncés au modèle et exécutables à l'exécution.
help.bot.workflowConfiguration=Quels workflows s'exécutent sur les webhooks de pull request (revues, génération de tests, ...). Laissez vide pour hériter de la valeur par défaut (revue seule). Sélectionnez la configuration vide « No PR workflows » pour garder le bot silencieux sur les PR.
help.bot.runOnPrCreation=Lorsqu'il est activé, le bot exécute son workflow de PR configuré lorsqu'une pull request est créée ou ouverte, même s'il n'est pas assigné comme relecteur.
help.bot.runOnPrUpdate=Lorsqu'il est activé, le bot exécute son workflow de PR configuré à chaque événement <code>synchronized</code> (nouveaux commits poussés sur la branche de la PR). Pris en charge sur GitHub et Gitea uniquement. Les installations existantes sont désactivées par défaut.
help.bot.issueWorkflow=Ce que fait ce bot lorsqu'il est assigné à une issue, et comment il gère les commentaires de suivi (ex. l'agent de codage implémente l'issue, l'agent rédacteur l'affine). Indépendant de la configuration de workflow de PR ci-dessus.
help.bot.runOnIssueCreation=Lorsqu'il est activé, le bot exécute son workflow d'issue configuré lorsqu'une issue est créée, même s'il n'est pas assigné à l'issue.
help.bot.deploymentTarget=Environnement d'aperçu par PR utilisé par les workflows nécessitant un déploiement en direct (ex. tests E2E). Gérez les cibles sous
help.bot.userWhitelist=Noms d'utilisateur Git autorisés à déclencher des interactions payantes en IA avec ce bot (ouverture/sync de PR, <code>@</code>-mentions, commentaires en ligne, travail d'agent sur les issues). Un nom par ligne ou séparé par des virgules ; la correspondance est insensible à la casse. <strong>Laissez vide pour autoriser tout le monde</strong> (par défaut historique). Recommandé pour les <strong>dépôts publics</strong> afin que des inconnus ne puissent pas consommer les jetons IA du bot.
help.bot.webhookSigningSecret=Lorsqu'il est défini, le bot vérifie la signature de webhook du fournisseur (<code>X-Hub-Signature-256</code> pour GitHub, <code>X-Gitea-Signature</code> pour Gitea, <code>X-Gitlab-Token</code> pour GitLab, <code>X-Hub-Signature</code> pour Bitbucket) et rejette les événements falsifiés. Configurez le même secret dans les paramètres de webhook du fournisseur. Stocké chiffré lorsque <code>APP_ENCRYPTION_KEY</code> est configurée. <strong>Fortement recommandé pour les dépôts publics.</strong>
help.bot.aiIntegrationMissing=<strong>Intégration IA</strong> — connecte le bot à un fournisseur d'IA (Anthropic, OpenAI, Google, ...).
help.bot.gitIntegrationMissing=<strong>Intégration Git</strong> — connecte le bot à une plateforme Git (Gitea, GitHub, GitLab, ...).
popover.toolCalling.title=Mode d'appel d'outils
popover.toolCalling.content=<p><strong>Activé (par défaut, recommandé)</strong> : les descripteurs d'outils sont envoyés via l'API d'appel de fonctions native du fournisseur (Anthropic <code>tools</code>, OpenAI/Ollama <code>tool_calls</code>, Google <code>functionDeclarations</code>). Le modèle renvoie des invocations d'outils structurées que la boucle d'agent répartit directement. C'est la voie recommandée pour les modèles de pointe — plus économe en jetons et plus fiable dans les workflows agentiques.</p><p><strong>Désactivé (repli hérité)</strong> : le catalogue d'outils est décrit dans le prompt système et le modèle doit répondre par un bloc JSON que l'agent analyse lui-même. Ne revenez à ce mode que si l'appel natif ne fonctionne pas de façon fiable — ex. avec des modèles plus faibles/petits ou certains backends auto-hébergés.</p><p>llama.cpp fonctionne toujours en mode hérité quel que soit ce commutateur. Voir <code>doc/TOOL_CALLING.md</code> pour le guide de dépannage complet.</p>
popover.promptCaching.title=Mise en cache du prompt
popover.promptCaching.content=<p><strong>Activé (par défaut, recommandé)</strong> : le client marque des points de rupture de cache sur le prompt système et sur la fin glissante de la conversation. Les workflows agentiques renvoient tout le préfixe de prompt (prompt système + diff + tous les résultats d'outils précédents) à chaque tour ; avec le cache, les préfixes répétés sont facturés comme des lectures de cache à environ 1/10 du prix d'entrée au lieu du prix plein, réduisant le coût de revue à une fraction.</p><p><strong>Désactivé</strong> : chaque requête est facturée au prix d'entrée plein. Ne désactivez que si votre endpoint de fournisseur rejette le champ <code>cache_control</code>.</p><p>Actuellement, seul le fournisseur Anthropic prend en charge le cache de prompt ; les autres ignorent ce commutateur.</p>
help.ai.contextWindow=Taille totale de la fenêtre de contexte du modèle. Utilisée pour le compactage proactif de l'historique.
help.ai.toolCalling=Recommandé pour les modèles de pointe — l'appel de fonctions natif est la valeur par défaut et la voie la plus économe en jetons et la plus fiable dans les workflows agentiques. Ne le désactivez que pour revenir à l'outillage JSON-in-prompt hérité si l'appel natif se comporte mal (ex. avec des modèles plus faibles ou certains backends auto-hébergés).
help.ai.promptCaching=Anthropic Claude uniquement — les préfixes de prompt mis en cache sont facturés à un tarif bien inférieur, ce qui réduit considérablement le coût des revues agentiques. Ignoré par les fournisseurs sans API de cache.
