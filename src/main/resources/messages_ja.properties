help.hook.url=<code>http://</code> または <code>https://</code> で始まる必要があります。配信は JSON ボディでここに POST され、2xx レスポンスはすべて成功とみなされます。
help.hook.eventTypes=少なくとも 1 つ。エンドポイントは、下のスコープに一致するチェックされた各イベントを受信します。
help.hook.customHeaders=各配信とともに送信されます。単一の JSON オブジェクトである必要があります。APP_ENCRYPTION_KEY が設定されている場合は暗号化して保存されます。編集時に現在の値を維持するには空欄にしてください。
help.hook.scope=3 つすべて空欄にすると、すべてのボットとリポジトリのイベントを受信するグローバルエンドポイントになります。
help.hook.secret=任意。設定すると、配信は <code>X-EventHook-Signature-256</code> で署名されます。
help.hook.keepSecret=現在のシークレットを維持するには空欄にしてください。
help.hook.authorizationHeader=任意の静的 <code>Authorization</code> ヘッダー値。例：<code>Bearer token123456</code> または <code>Basic YWxhZGRpbjpvcGVuc2VzYW1l</code>。
help.hook.keepValue=現在の値を維持するには空欄にしてください。
help.hook.skipTls=安全ではありません：HTTPS 証明書の検証を無効にします。自己署名／内部エンドポイント専用です。
