aiTest.error.configuration=無効な設定: {0}
aiTest.error.unauthorized=プロバイダーが API キーを拒否しました (HTTP {0})。キーとその権限を確認してください。
aiTest.error.notFound=プロバイダーが HTTP {0} を返しました。API URL とモデル名を確認してください。
aiTest.error.proxyAuth=プロキシで認証が必要です (HTTP {0})。送信接続用のプロキシ認証情報を設定してください。
aiTest.error.rateLimited=プロバイダーがこのキーをレート制限しているか、クォータを使い切っています (HTTP {0})。
aiTest.error.serverError=プロバイダーがサーバーエラーを報告しました (HTTP {0})。しばらくしてから再試行してください。
aiTest.error.http=プロバイダーがリクエストを拒否しました (HTTP {0})。モデル名、最大トークン数、API バージョンを確認してください。
aiTest.error.unknownHost=ホスト名を解決できませんでした: {0}。API URL とサーバーの DNS 設定を確認してください。
aiTest.error.tls=TLS 接続に失敗しました: {0}。証明書が自己署名、期限切れ、またはプロキシによって置き換えられている可能性があります。CA をトラストストアに追加してください。
aiTest.error.connectTimeout=サーバーが応答する前に接続がタイムアウトしました。ファイアウォールやプロキシが送信接続をブロックしているか、API URL のホストまたはポートが誤っている可能性があります。
aiTest.error.readTimeout=サーバーは接続を受け付けましたが、モデルが時間内に応答しませんでした。モデルがまだ読み込み中、ハードウェアが低速、または推論モデルが長時間思考している可能性があります。モデルの読み込み後に再テストするか、HTTP_CLIENT_READ_TIMEOUT を増やしてください。
aiTest.error.connectionRefused=接続が拒否されたか、ホストに到達できません。API URL、ポート、ファイアウォール、プロキシを確認してください。
aiTest.error.unexpected=テストに失敗しました: {0}
