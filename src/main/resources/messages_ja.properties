workflow.unit-test-author.param.framework.option.make.description=汎用 — `make test` を実行します。
workflow.unit-test-author.param.framework.option.gcc.description=C — プロジェクトの Makefile に対して `make test` を実行します。
workflow.unit-test-author.param.framework.option.g++.description=C++ — プロジェクトの Makefile に対して `make test` を実行します。
