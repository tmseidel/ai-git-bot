reviewQuality.since.authors.none=PR 作成者は今後のレビューから記録されます。
reviewQuality.def.counting=集計ルール
reviewQuality.def.finalized=確定した記録を持つエージェント型レビューのみを集計します。失敗・キャンセル・放棄された実行は「レビューの結論」にのみ表示されます。取り下げた指摘は集計しません。
reviewQuality.def.pr=PR は Git 統合・ボット・リポジトリ・番号ごとに 1 件と数え、最初に確定したレビューの期間に含めます。指摘の数値はその初回レビューを使うため、5 回レビューされた PR も 1 回の PR と同じ重みになります。
reviewQuality.def.feedback=フィードバックはレビュアーと対象ごとの有効な記録で集計します。置き換え済み・取り消し済みの記録は履歴扱いです。
reviewQuality.def.sample=各比率はホバーで分子と分母を表示します。{0} 件未満の場合は誤解を招く割合の代わりに「–」を表示します。
reviewQuality.def.resolution=解決・継続・新規
reviewQuality.def.matching=レビューが確定すると、各指摘を同じ PR の前回のレビューと照合します。条件は、同じファイルでタイトルの単語の半分以上が共通していること — または同じカテゴリで行が近く、共通する単語があることです。ヒューリスティックであり、同じ問題を指していることの証明ではありません。
reviewQuality.def.cost=コストと効果
reviewQuality.def.costText=コストは、エージェント型レビューの実行（レビューとフォローアップの回答）のトークン使用量です。各 AI インタラクションのコストは記録時に AI 統合のトークン価格で計算されて保存されるため、後から価格やモデル、名前を変更しても過去のコストは変わりません。効果は「コスト」タブの前提条件に基づく推定値です。
reviewQuality.def.notShown=あえて表示しないもの
reviewQuality.def.noScore=単一の「コード品質スコア」: 指摘はモデル、プロンプト、レッスン、diff サイズに左右されるため、1 つの数値ではそれが見えなくなります。
reviewQuality.def.noRanking=作成者別のランキング: 作成者の表はオプトインで、名前順に並べ、チーム平均と比較することはありません。
reviewQuality.def.utc=期間と集計単位は UTC 基準で、週は月曜日に始まります。
flash.aiPricesInvalid=トークン価格は空欄にするか、0 以上の数値を入力してください。
