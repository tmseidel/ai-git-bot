# Workflow names
workflow.review.name=PR レビュー
workflow.agentic-review.name=エージェンティック PR レビュー
workflow.unit-test-author.name=AI ユニットテスト
workflow.readme-sync.name=README 同期
workflow.i18n-coverage.name=i18n カバレッジ
workflow.issue-triage.name=Issue トリアージ
workflow.issue-coding.name=コーディングエージェント
workflow.issue-writer.name=ライターエージェント
workflow.e2e-test.name=E2E テスト
workflow.review.description=プルリクエストの作成・更新時に AI コードレビューを単一の PR コメントとして投稿し、@メンションやインラインのレビューコメントに会話形式で応答し、設定されたレビュー後アクションに基づいて承認または変更を要求します。
workflow.agentic-review.description=読み取り専用のリポジトリツールと MCP ツールを繰り返し呼び出してコンテキストを収集し、その結果を Markdown コメントとして書き出す LLM でプルリクエストをレビューします。
workflow.i18n-coverage.description=プルリクエストの i18n 変更（追加・変更・削除されたキー）がロケールファイルに一貫して反映されていないことを検出し、設定可能な基準ロケールに対して不足している翻訳を LLM エージェントがロケールごとに起草し、短いサマリーを投稿します。messages_*.properties と i18n/*.json に対応します。
workflow.unit-test-author.description=プルリクエストの差分に対するホワイトボックスのユニットテストを生成し、プロジェクト独自のテストランナーで実行し、（任意で）合格したテストを PR ブランチにコミットします。PR ヘッドのチェックアウト上で動作し、プレビューデプロイは不要です。
workflow.e2e-test.description=プルリクエストのプレビューを設定されたデプロイターゲットに展開し、ライブプレビューに対してエンドツーエンドテストを生成・実行して、Markdown のサマリーを投稿します。デプロイターゲットが必要で、re-run / regenerate のスラッシュコマンドに対応します。
workflow.readme-sync.description=プルリクエストのコード変更によってプロジェクトの Markdown ドキュメントが不正確または古くなったことを検出し、LLM エージェントが（設定された範囲内で）関連ドキュメントを更新・作成・削除し、短いサマリーを投稿します。Markdown のみで、変更対象は設定されたパターンに制限されます。
workflow.issue-writer.description=ライターエージェントが、割り当てられた Issue を明確に仕様化されたテスト可能な Issue に洗練し、Issue コメントでフォローアップの質問に回答します。
workflow.issue-coding.description=コーディングエージェントが割り当てられた Issue を実装し（ワークスペース、ブランチ、プルリクエスト）、フォローアップの Issue コメントで実装を継続します。
workflow.issue-triage.description=新規または新たに割り当てられた Issue を、リポジトリ/Issue のコンテキストを収集して判断するエージェントが適切な担当者（人、ボット、またはなし）にルーティングし、ルーティング理由をコメントとして投稿して割り当てを実行します。Issue 自体を実装することはありません。
