# Workflow param field descriptions
workflow.review.param.maxDiffCharsPerChunk.description=分割前の diff チャンクあたりの最大文字数。PR の diff 全体はレビュー用にこのサイズのチャンクに分割されます。
workflow.review.param.maxDiffChunks.description=レビューする diff チャンクの最大数。この上限を超えるチャンクはスキップされます。
workflow.review.param.retryTruncatedChunkChars.description=チャンクがモデルのコンテキストウィンドウに対して大きすぎる場合（プロンプトが長すぎるエラー）、この文字数に切り詰めて一度だけ再試行されます。
workflow.review.param.excludedFilePatterns.description=レビュー diff から除外するファイルのカンマ区切りのグロブ／ファイル名パターン（例：*.lock、*.min.js、package-lock.json、**/generated/**）。一致するファイル部分は AI に送信する前に除去され、トークン消費とノイズを削減します。空欄にするとすべてのファイルをレビューします。
workflow.agentic-review.param.maxToolRounds.description=エージェントが実行できる探索／回答ラウンド数の上限。
workflow.agentic-review.param.enableFormalReviewDecision.description=有効にすると、ボットは正式な PR レビュー判定を投稿できます。
workflow.agentic-review.param.formalReviewDecisionPrompt.description=モデルが指摘事項を重大度別に分類するために使用する基準。
workflow.agentic-review.param.blockerThreshold.description=正式な承認で許容される BLOCKER 指摘の最大数。空欄にすると無視されます。
workflow.agentic-review.param.mediumThreshold.description=正式な承認で許容される MEDIUM（中程度）指摘の最大数。空欄にすると無視されます。
workflow.agentic-review.param.lowThreshold.description=正式な承認で許容される LOW（軽微）指摘の最大数。空欄にすると無視されます。
workflow.e2e-test.param.framework.description=playwright（デフォルト、十分にテスト済み）— pytest、k6、cypress は実験的で、スモークテストのみです。
workflow.e2e-test.param.maxRetries.description=テストあたりの再試行予算。再試行後に成功したテストには FLAKY とタグ付けされます。
workflow.e2e-test.param.maxTestCases.description=コストガード — 設定値に関係なく、固定の上限で制限されます。
workflow.e2e-test.param.suiteLifecycle.description=PR が閉じられた後に生成されたスイートがどうなるかを指定します。
workflow.e2e-test.param.promotionThresholdPercent.description=スイートが昇格するために合格しなければならない、実行されたテストケースの最小割合（offer-as-pr / commit-to-pr / promote-on-merge に適用）。100（デフォルト）は完全にグリーンのスイートのみ昇格することを意味します。例えば 80 に下げると、80% 以上合格した場合にも昇格します。ERROR や SKIPPED のスイートはこの値に関係なく昇格されません。ヒント：LLM 生成テストは初回で 100% 実行できることは稀です。回帰テストの基準として扱い、絶対的な真実とは考えないでください。
workflow.i18n-coverage.param.includedFilePatterns.description=i18n ロケールファイルを特定する改行またはカンマ区切りのグロブパターン。このパターンは、ワークフローが検査するファイルと、作成・更新・削除が許可されるファイルの両方を定義します。生成されるのはロケールファイル（*.properties / *.json）のみです。グロブは **（任意のパスセグメント）、*（セグメント内）、? をサポートします。例：messages_*.properties、i18n/*.json。
workflow.i18n-coverage.param.baselineLocale.description=任意。他のロケールファイルのキー／値／削除を比較する基準ロケール（例：en、en_US）。基準キーが欠けている非基準ロケールファイルには翻訳が起草され、基準で定義されなくなったキーは削除されます。空欄にするとバンドルファミリーごとに基準を自動検出します — messages.properties のような暗黙のデフォルト（サフィックスなし）ファイルがあれば使用し、なければ最初のロケールファイルを使用します。空の値はそのまま保存され、デフォルトには戻りません。
workflow.i18n-coverage.param.maxToolRounds.description=エージェントが実行できる探索／書き込みラウンド数の上限。値を大きくすると、より大きな翻訳更新が可能になりますが、トークンコストが増加します。
workflow.i18n-coverage.param.suiteLifecycle.description=生成された翻訳変更をどう処理するかを指定します。
workflow.readme-sync.param.includedFilePatterns.description=ドキュメントの範囲を定義する改行またはカンマ区切りのグロブパターン。このパターンは、読み取るドキュメントと、作成・更新・削除が許可されるファイルの両方を定義します。生成されるのは Markdown ファイル（*.md / *.markdown）のみです。グロブは **（任意のパスセグメント）、*（セグメント内）、? をサポートします。翻訳バリアント（例：README.de.md）は README.*.md のようなパターンでカバーされる場合に含まれます。
workflow.readme-sync.param.maxToolRounds.description=エージェントが実行できる探索／書き込みラウンド数の上限。値を大きくすると、より大きなドキュメント更新が可能になりますが、トークンコストが増加します。
workflow.readme-sync.param.suiteLifecycle.description=生成されたドキュメント変更をどう処理するかを指定します。
workflow.unit-test-author.param.framework.description=auto のままにしてリポジトリからツールチェーンを検出するか、明示的に固定します。
workflow.unit-test-author.param.maxRetries.description=失敗したスイートを失敗と報告する前に再実行する回数（0-5）。
workflow.unit-test-author.param.maxTestCases.description=コストガード — 値に関係なく、固定の上限で制限されます。
workflow.unit-test-author.param.suiteLifecycle.description=生成されたテストをどう処理するかを指定します。
workflow.issue-triage.param.systemPrompt.description=トリアージモデルのルーティング指示。使用前に必ず確認してください：役割の説明、アカウント名、ボット名を確認し、リストされた各アカウントが接続先の Git プロバイダーに存在し割り当て可能であることを確かめてください。アカウント名は、下の許可された担当者と同期させてください。
workflow.issue-triage.param.assignees.description=ワークフローが Issue を割り当てられるアカウント名のカンマ区切りリスト。'none' は常に許可され、理由を投稿するが Issue を未割り当てのままにすることを意味します。
workflow.e2e-test.param.framework.option.playwright.description=Node.js — デフォルト、十分にテスト済み。
workflow.e2e-test.param.framework.option.pytest.description=Python — 実験的。
workflow.e2e-test.param.framework.option.k6.description=Grafana k6 負荷テスト — 実験的。
workflow.e2e-test.param.framework.option.cypress.description=Node.js — 実験的。
workflow.e2e-test.param.suiteLifecycle.option.ephemeral.description=PR が閉じられたときにスイートとテストケースを削除します（デフォルト）。
workflow.e2e-test.param.suiteLifecycle.option.offer-as-pr.description=生成されたテストを含むフォローアップ PR を機能ブランチに対して開きます。
workflow.e2e-test.param.suiteLifecycle.option.promote-on-merge.description=親 PR がマージされたら、デフォルトブランチに対してフォローアップ PR を開きます。
workflow.e2e-test.param.suiteLifecycle.option.commit-to-pr.description=生成されたテストを機能ブランチに直接コミットします。
workflow.i18n-coverage.param.suiteLifecycle.option.commit-to-pr.description=翻訳変更を PR ブランチに直接コミットします（デフォルト）。
workflow.i18n-coverage.param.suiteLifecycle.option.offer-as-pr.description=翻訳変更を含むフォローアップ PR を PR ブランチに対して開きます。
workflow.i18n-coverage.param.suiteLifecycle.option.ephemeral.description=提案された翻訳変更をコミットせずに報告します。
workflow.readme-sync.param.suiteLifecycle.option.commit-to-pr.description=ドキュメント変更を PR ブランチに直接コミットします（デフォルト）。
workflow.readme-sync.param.suiteLifecycle.option.offer-as-pr.description=ドキュメント変更を含むフォローアップ PR を PR ブランチに対して開きます。
workflow.readme-sync.param.suiteLifecycle.option.ephemeral.description=提案されたドキュメント変更をコミットせずに報告します。
workflow.unit-test-author.param.framework.option.auto.description=pom.xml / build.gradle / package.json / go.mod / Cargo.toml / *.csproj / Gemfile / pyproject.toml / Makefile から検出します（デフォルト）。
