help.bot.systemPrompt=コードレビュー、コーディングエージェントの実装、ライターエージェントのワークフローで使用するプロンプトセットを選択します。
help.bot.mcpConfiguration=任意のリモート MCP ツール。選択したツールのみがプロンプトに公開されます。
help.bot.toolConfiguration=このボットが AI に公開できる内蔵エージェントツール（ファイル、コンテキスト、検証、リポジトリ）のホワイトリスト。有効なツールのみがモデルに通知され、実行時に実行可能になります。
help.bot.workflowConfiguration=プルリクエストの Webhook で実行するワークフロー（レビュー、テスト生成など）。空欄にするとデフォルト（レビューのみ）を継承します。空の「No PR workflows」設定を選ぶと、PR では何も行いません。
help.bot.runOnPrCreation=有効にすると、ボットはプルリクエストが作成または開かれたときに、レビュアーとして割り当てられていなくても設定済みの PR ワークフローを実行します。
help.bot.runOnPrUpdate=有効にすると、ボットは <code>synchronized</code> イベント（PR ブランチへの新しいコミット）ごとに設定済みの PR ワークフローを実行します。GitHub と Gitea のみ対応。既存の環境ではデフォルトでオフです。
help.bot.issueWorkflow=このボットが Issue に割り当てられたときの動作と、フォローアップの Issue コメントの処理方法（例：コーディングエージェントが実装、ライターエージェントが洗練）。上記の PR ワークフロー設定とは独立しています。
help.bot.runOnIssueCreation=有効にすると、ボットは Issue が作成されたときに、その Issue に割り当てられていなくても設定済みの Issue ワークフローを実行します。
help.bot.deploymentTarget=ライブデプロイを必要とするワークフロー（例：E2E テスト）が使用する PR ごとのプレビュー環境。ターゲットの管理は
help.bot.userWhitelist=このボットとの AI 有料インタラクション（PR のオープン／同期、<code>@</code>メンション、インラインコメント、エージェントの Issue 作業）をトリガーできる Git ユーザー名。1 行に 1 ユーザー名、またはカンマ区切り。大文字小文字は区別されません。<strong>空欄にすると全員を許可</strong>（従来のデフォルト）。未知のユーザーにボットの AI トークンを消費させないよう、<strong>公開リポジトリ</strong>では推奨されます。
help.bot.webhookSigningSecret=設定すると、ボットはプロバイダーの Webhook 署名を検証し（GitHub は <code>X-Hub-Signature-256</code>、Gitea は <code>X-Gitea-Signature</code>、GitLab は <code>X-Gitlab-Token</code>、Bitbucket は <code>X-Hub-Signature</code>）、偽造イベントを拒否します。同じシークレットをプロバイダーの Webhook 設定で構成してください。<code>APP_ENCRYPTION_KEY</code> が設定されている場合は暗号化して保存されます。<strong>公開リポジトリでは強く推奨されます。</strong>
help.bot.aiIntegrationMissing=<strong>AI 統合</strong> — ボットを AI プロバイダー（Anthropic、OpenAI、Google など）に接続します。
help.bot.gitIntegrationMissing=<strong>Git 統合</strong> — ボットを Git プラットフォーム（Gitea、GitHub、GitLab など）に接続します。
popover.toolCalling.title=ツール呼び出しモード
popover.toolCalling.content=<p><strong>オン（デフォルト、推奨）</strong>：ツール記述子はプロバイダーのネイティブ関数呼び出し API（Anthropic <code>tools</code>、OpenAI/Ollama <code>tool_calls</code>、Google <code>functionDeclarations</code>）を通じて送信されます。モデルは構造化されたツール呼び出しを返し、エージェントループが直接ディスパッチします。フロンティアモデルでは推奨されるルートで、トークン効率が高く、エージェンティックワークフローでより信頼性があります。</p><p><strong>オフ（レガシーフォールバック）</strong>：ツールカタログはシステムプロンプト内に記述され、モデルはエージェントが自ら解析する JSON ブロックで応答するよう求められます。ネイティブツール呼び出しが確実に動作しない場合（例：弱い／小さいモデルや一部のセルフホストバックエンド）のみ、このモードにフォールバックしてください。</p><p>llama.cpp はこのスイッチに関係なく常にレガシーモードで動作します。トラブルシューティングの全手順は <code>doc/TOOL_CALLING.md</code> を参照してください。</p>
popover.promptCaching.title=プロンプトキャッシュ
popover.promptCaching.content=<p><strong>オン（デフォルト、推奨）</strong>：クライアントはシステムプロンプトと会話の末尾にキャッシュブレークポイントを設定します。エージェンティックワークフローは毎ラウンド、プロンプトプレフィックス全体（システムプロンプト＋diff＋過去のツール結果すべて）を再送信します。キャッシュにより、繰り返しのプレフィックスは全額ではなく入力価格の約 1/10 のキャッシュ読み取りとして課金され、レビューコストを大幅に削減します。</p><p><strong>オフ</strong>：すべてのリクエストが全額の入力価格で課金されます。プロバイダーエンドポイントが <code>cache_control</code> フィールドを拒否する場合のみオフにしてください。</p><p>現在、プロンプトキャッシュをサポートするのは Anthropic プロバイダーのみで、他のプロバイダーはこのスイッチを無視します。</p>
help.ai.contextWindow=モデルの総コンテキストウィンドウサイズ。プロアクティブな履歴の圧縮に使用されます。
help.ai.toolCalling=フロンティアモデルでは推奨されます。ネイティブ関数呼び出しはデフォルトで、エージェンティックワークフローで最もトークン効率が高く信頼性のあるルートです。ネイティブツール呼び出しが正常に動作しない場合（例：弱いモデルや一部のセルフホストバックエンド）のみ、レガシーの JSON-in-prompt ツールにフォールバックするためにオフにしてください。
help.ai.promptCaching=Anthropic Claude のみ対応 — キャッシュされたプロンプトプレフィックスは大幅に低いレートで課金され、エージェンティックレビューのコストを大幅に削減します。キャッシュ API のないプロバイダーでは無視されます。
