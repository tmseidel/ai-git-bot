help.prompt.e2ePlannerInfo=フルスタック QA ワークフローで使用されます。エージェントの<strong>役割の説明</strong>のみ編集してください。技術プロトコル（アクティブなフレームワーク、JSON 出力スキーマ、ツール名と呼び出し順序、URL 規約）は常にソフトウェアが追加するもので、ここでは<strong>編集できません</strong>。そのため編集によってパイプラインが壊れることはありません。
