help.mcp.description=リモート／ネットワーク MCP 設定を入力してください。ローカルの <code>stdio</code> トランスポートは拒否されます。<br/>例については <a href="https://github.com/tmseidel/ai-git-bot/blob/main/doc/MCP_SERVER_HANDLING.md" target="_blank">doc/MCP_SERVER_HANDLING.md</a> を参照してください。
help.botTools.defaultInfo=これは<strong>デフォルト</strong>のツール設定です。常に登録済みのすべての内蔵ツールを含み、名前変更や削除はできません。ツール選択は自動的に管理されます。ボットに公開するツールを制限するには、新しい設定を作成してください。
help.botTools.defaultSelectionInfo=<strong>デフォルト</strong>のツール設定は常に登録済みのすべての内蔵ツールを含み、読み取り専用です。カスタムサブセットを作成するにはクローンしてください。
help.prompt.reviewAgentInfo=<strong>エージェンティック PR レビュー</strong>ワークフローで使用されます。エージェントの<strong>役割の説明</strong>のみ編集してください。読み取り専用のツールプロトコル（利用可能なツールと呼び出し規約）はソフトウェアが追加するもので、ここでは<strong>編集できません</strong>。
help.prompt.e2ePlannerInfo=フルスタック QA ワークフローで使用されます。エージェントの<strong>役割の説明</strong>のみ編集してください。技術プロトコル（アクティブなフレームワーク、JSON 出力スキーマ、ツール名と呼び出し順序、URL 規約）は常にソフトウェアが追加するもので、ここでは<strong>編集できません</strong>。そのため編集によってパイプラインが壊れることはありません。
