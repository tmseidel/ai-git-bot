help.git.gitlabToken=api および read_repository スコープを持つ GitLab Personal Access Token。GitLab 設定 → アクセストークンを参照。
help.git.bitbucketToken=Bitbucket スコープ付きの Atlassian API トークン（id.atlassian.com → セキュリティ → スコープ付き API トークンを作成）。必要なスコープ：read:user:bitbucket, read:repository:bitbucket, write:repository:bitbucket, read:pullrequest:bitbucket, write:pullrequest:bitbucket。
help.git.azureDevopsToken=Code (read & write)、Pull Request Threads (read & write)、Identity (read) のスコープを持つ Azure DevOps Personal Access Token。ユーザー設定 → Personal access tokens で作成します。
help.git.azureDevopsUrl=Azure DevOps Services の場合は https://dev.azure.com（1 つの連携でトークンがアクセスできるすべての組織に対応）または 1 つの組織のみなら https://dev.azure.com/組織名、Azure DevOps Server の場合はサーバー URL（例: https://tfs.example.com/tfs）。Azure DevOps Server ではコレクションは省略可能です。省略すると 1 つの連携ですべてのコレクションに対応し、指定すると（…/tfs/DefaultCollection）そのコレクションのみに対応します。
