help.deploymentTarget.callbackUrl=非同期ストラテジー（例：<code>WEBHOOK</code>）は、プレビュー環境の準備ができたらこの URL でボットにコールバックする必要があります。<code>{runId}</code> と <code>{secret}</code> プレースホルダーはリクエストごとに埋められ、送信 Webhook ペイロードに <code>callbackUrl</code> として埋め込まれます。
help.deploymentTarget.publicBaseUrl=<code>ai-git-bot.public-base-url</code> プロパティを設定すると（例：<code>https://bot.acme.io</code>）、ボットが完全修飾 URL を渡せるようになります。
help.deploymentTarget.name=ボットフォームのドロップダウンに表示される一意の識別子。
help.deploymentTarget.previewUrlTemplate=任意。<code>STATIC</code> では必須、<code>WEBHOOK</code> では参考情報です。プレースホルダー：<code>{prNumber}</code>、<code>{sha}</code>、<code>{branch}</code>。
help.deploymentTarget.timeout=オーケストレーターがストラテジー／コールバックを待つ最大時間。
help.deploymentTarget.strategyConfig=<strong>WEBHOOK</strong>: <code>{ "webhookUrl": "&lt;url&gt;", "sharedSecret": "&lt;hex&gt;", "headers": { ... } }</code>。<br/><strong>STATIC</strong>: <code>{ "healthcheckPath": "/healthz", "expectedStatus": 200, "intervalSeconds": 5, "extraHeaders": { ... } }</code>。<br/><strong>MCP</strong> <em>（実験的）</em>: <code>{ "mcpConfigurationId": &lt;id&gt;, "deployTool": "&lt;修飾名&gt;", "statusTool": "&lt;修飾名&gt;", "teardownTool": "&lt;修飾名&gt;", "argsTemplate": { "branch": "{branch}", "sha": "{sha}" } }</code>。すべてのツール名は参照先の MCP 設定でホワイトリスト登録されている必要があります。そうでない場合は保存が拒否されます。<br/><strong>CI_ACTION</strong>: <code>{ "workflowRef": "preview.yml", "refTemplate": "refs/heads/{branch}", "previewUrlOutput": "preview_url", "pollIntervalSeconds": 15, "inputs": { "callbackUrl": "{callbackUrl}" } }</code>。<code>workflowRef</code> はワークフローファイル（GitHub / Gitea Actions）、パイプライントリガートークン（GitLab CI）、またはカスタムパイプラインパターン（Bitbucket Pipelines）です。<code>refTemplate</code> はリモートに既に存在する<em>ブランチまたはタグ</em>に解決される必要があります（デフォルト：<code>refs/heads/{branch}</code>）。Gitea、GitLab、Bitbucket はディスパッチ時に <code>refs/pull/N/head</code> のようなプルリクエスト ref を拒否します。GitHub Actions はさらに <code>refs/pull/{prNumber}/head</code> をサポートします（フォーク PR に必要）。プロバイダーごとのレシピは <a href="https://github.com/tmseidel/ai-git-bot/blob/main/doc/PR_WORKFLOWS_CI_ACTIONS.md" target="_blank">doc/PR_WORKFLOWS_CI_ACTIONS.md</a> を参照してください。<br/>完全なスキーマは <a href="https://github.com/tmseidel/ai-git-bot/blob/main/doc/PR_WORKFLOWS.md" target="_blank">doc/PR_WORKFLOWS.md → Deployment targets</a> を参照してください。
