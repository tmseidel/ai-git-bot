help.botTools.defaultInfo=これは<strong>デフォルト</strong>のツール設定です。常に登録済みのすべての内蔵ツールを含み、名前変更や削除はできません。ツール選択は自動的に管理されます。ボットに公開するツールを制限するには、新しい設定を作成してください。
