help.deploymentTarget.callbackUrl=Asynchrone Strategien (z. B. <code>WEBHOOK</code>) müssen den Bot auf dieser URL zurückrufen, sobald die Vorschauumgebung bereit ist. Die Platzhalter <code>{runId}</code> und <code>{secret}</code> werden pro Anfrage gefüllt und als <code>callbackUrl</code> in die ausgehende Webhook-Nutzlast eingebettet.
help.deploymentTarget.publicBaseUrl=Setzen Sie die Eigenschaft <code>ai-git-bot.public-base-url</code> (z. B. <code>https://bot.acme.io</code>), damit der Bot eine vollständig qualifizierte URL ausgeben kann.
help.deploymentTarget.name=Eindeutige Kennung, die im Dropdown des Bot-Formulars angezeigt wird.
help.deploymentTarget.previewUrlTemplate=Optional. Erforderlich für <code>STATIC</code>; informativ für <code>WEBHOOK</code>. Platzhalter: <code>{prNumber}</code>, <code>{sha}</code>, <code>{branch}</code>.
help.deploymentTarget.timeout=Maximale Zeit, die der Orchestrator auf die Strategie / den Callback wartet.
help.deploymentTarget.strategyConfig=<strong>WEBHOOK</strong>: <code>{ "webhookUrl": "&lt;url&gt;", "sharedSecret": "&lt;hex&gt;", "headers": { ... } }</code>.<br/><strong>STATIC</strong>: <code>{ "healthcheckPath": "/healthz", "expectedStatus": 200, "intervalSeconds": 5, "extraHeaders": { ... } }</code>.<br/><strong>MCP</strong> <em>(experimentell)</em>: <code>{ "mcpConfigurationId": &lt;id&gt;, "deployTool": "&lt;qualifizierter-name&gt;", "statusTool": "&lt;qualifizierter-name&gt;", "teardownTool": "&lt;qualifizierter-name&gt;", "argsTemplate": { "branch": "{branch}", "sha": "{sha}" } }</code>. Alle Tool-Namen müssen auf der referenzierten MCP-Konfiguration freigeschaltet sein — andernfalls wird das Speichern abgelehnt.<br/><strong>CI_ACTION</strong>: <code>{ "workflowRef": "preview.yml", "refTemplate": "refs/heads/{branch}", "previewUrlOutput": "preview_url", "pollIntervalSeconds": 15, "inputs": { "callbackUrl": "{callbackUrl}" } }</code>. <code>workflowRef</code> ist die Workflow-Datei (GitHub / Gitea Actions), das Pipeline-Trigger-Token (GitLab CI) oder das benutzerdefinierte Pipeline-Muster (Bitbucket Pipelines). <code>refTemplate</code> muss auf einen <em>Branch oder Tag</em> verweisen, der bereits auf dem Remote existiert (Standard: <code>refs/heads/{branch}</code>) — Gitea, GitLab und Bitbucket lehnen Pull-Request-Refs wie <code>refs/pull/N/head</code> beim Auslösen ab. GitHub Actions unterstützt zusätzlich <code>refs/pull/{prNumber}/head</code> (für Fork-PRs erforderlich). Siehe <a href="https://github.com/tmseidel/ai-git-bot/blob/main/doc/PR_WORKFLOWS_CI_ACTIONS.md" target="_blank">doc/PR_WORKFLOWS_CI_ACTIONS.md</a> für ein Rezept pro Anbieter.<br/>Siehe <a href="https://github.com/tmseidel/ai-git-bot/blob/main/doc/PR_WORKFLOWS.md" target="_blank">doc/PR_WORKFLOWS.md → Deployment targets</a> für das vollständige Schema.
