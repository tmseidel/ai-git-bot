help.hook.name=Lesbares Label, das in der Endpunktliste angezeigt wird.
help.hook.url=Muss mit <code>http://</code> oder <code>https://</code> beginnen. Zustellungen werden hier mit JSON-Body gepostet; jede 2xx-Antwort gilt als Erfolg.
help.hook.eventTypes=Mindestens eines. Der Endpunkt erhält jedes ausgewählte Ereignis, das seinem unten stehenden Umfang entspricht.
help.hook.customHeaders=Wird mit jeder Zustellung gesendet. Muss ein einzelnes JSON-Objekt sein. Bei konfiguriertem APP_ENCRYPTION_KEY verschlüsselt gespeichert; beim Bearbeiten leer lassen, um den aktuellen Wert zu behalten.
help.hook.scope=Alle drei leer lassen für einen globalen Endpunkt, der Ereignisse von jedem Bot und Repository empfängt.
help.hook.secret=Optional. Wenn gesetzt, werden Zustellungen mit <code>X-EventHook-Signature-256</code> signiert.
help.hook.keepSecret=Leer lassen, um das aktuelle Geheimnis zu behalten.
help.hook.authorizationHeader=Optionaler statischer <code>Authorization</code>-Header-Wert, z. B. <code>Bearer token123456</code> oder <code>Basic YWxhZGRpbjpvcGVuc2VzYW1l</code>.
help.hook.keepValue=Leer lassen, um den aktuellen Wert zu behalten.
help.hook.skipTls=Unsicher: deaktiviert die HTTPS-Zertifikatprüfung. Nur für selbstsignierte/interne Endpunkte verwenden.
