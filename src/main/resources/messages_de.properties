help.ai.openRouter.routing=EU/US benötigen einen freigeschalteten Enterprise-Account. Schlüssel und Region werden beim Speichern geprüft. Angeforderte Parameter sind verpflichtend; Provider-Fallbacks sind deaktiviert.
help.ai.openRouter.privacy=ZDR erlaubt nur Endpunkte ohne Datenspeicherung, auch wenn die Datenerfassung durch Provider auf Erlauben steht. Erlauben setzt ZDR nicht außer Kraft.
