# Workflow param field descriptions
workflow.review.param.maxDiffCharsPerChunk.description=Maximale Zeichen pro Diff-Block vor dem Aufteilen. Der gesamte PR-Diff wird für die Review in Blöcke dieser Größe aufgeteilt.
workflow.review.param.maxDiffChunks.description=Maximale Anzahl zu prüfender Diff-Blöcke. Weitere Blöcke jenseits dieses Limits werden übersprungen.
workflow.review.param.retryTruncatedChunkChars.description=Wenn ein Block für das Kontextfenster des Modells zu groß ist (Prompt-zu-lang-Fehler), wird er auf diese Zeichenzahl gekürzt und einmal erneut versucht.
workflow.review.param.excludedFilePatterns.description=Kommagetrennte Glob-/Dateinamen-Muster für Dateien, die vom Review-Diff ausgeschlossen werden (z. B. *.lock, *.min.js, package-lock.json, **/generated/**). Treffende Dateiabschnitte werden vor dem Senden an die KI entfernt, was Tokenverbrauch und Rauschen reduziert. Leer lassen, um alle Dateien zu prüfen.
workflow.agentic-review.param.maxToolRounds.description=Obergrenze dafür, wie viele Erkundungs-/Antwortrunden der Agent durchlaufen darf.
workflow.agentic-review.param.enableFormalReviewDecision.description=Wenn aktiviert, kann der Bot eine formale PR-Review-Entscheidung veröffentlichen.
workflow.agentic-review.param.formalReviewDecisionPrompt.description=Kriterien, die das Modell zur Klassifizierung der Befunde nach Schweregrad verwendet.
workflow.agentic-review.param.blockerThreshold.description=Maximal erlaubte BLOCKER-Befunde für eine formale Genehmigung. Leer lassen, um zu ignorieren.
workflow.agentic-review.param.mediumThreshold.description=Maximal erlaubte MITTLERE Befunde für eine formale Genehmigung. Leer lassen, um zu ignorieren.
workflow.agentic-review.param.lowThreshold.description=Maximal erlaubte GERINGE Befunde für eine formale Genehmigung. Leer lassen, um zu ignorieren.
workflow.e2e-test.param.framework.description=playwright (Standard, gut getestet) — pytest, k6, cypress sind experimentell und nur oberflächlich getestet.
workflow.e2e-test.param.maxRetries.description=Wiederholungsbudget pro Test. Ein Test, der nach Wiederholungen besteht, wird als FLAKY markiert.
workflow.e2e-test.param.maxTestCases.description=Kostenbegrenzung — unabhängig vom konfigurierten Wert auf ein festes Maximum begrenzt.
workflow.e2e-test.param.suiteLifecycle.description=Was nach dem Schließen der PR mit der generierten Suite passiert.
workflow.e2e-test.param.promotionThresholdPercent.description=Mindestprozentsatz ausgeführter Testfälle, die bestehen müssen, damit die Suite übernommen wird (gilt für offer-as-pr / commit-to-pr / promote-on-merge). 100 (Standard) bedeutet, dass nur vollständig grüne Suiten übernommen werden; senken Sie den Wert z. B. auf 80, um auch bei mindestens 80 % bestandenen Tests zu übernehmen. Suiten mit ERROR oder SKIPPED werden unabhängig von diesem Wert nie übernommen. Hinweis: LLM-generierte Tests sind beim ersten Versuch selten zu 100 % lauffähig — behandeln Sie sie als Regressionstest-Basis, nicht als verlässliche Referenz.
workflow.i18n-coverage.param.includedFilePatterns.description=Durch Zeilenumbrüche oder Kommas getrennte Glob-Muster für die i18n-Locale-Dateien. Diese Muster definieren SOWOHL die zu prüfenden ALS AUCH die zu erstellenden/ändernden/löschenden Dateien. Es werden nur Locale-Dateien (*.properties / *.json) erzeugt. Globs unterstützen ** (beliebige Pfadsegmente), * (innerhalb eines Segments) und ?. Beispiele: messages_*.properties, i18n/*.json.
workflow.i18n-coverage.param.baselineLocale.description=Optional. Die Referenz-Locale, mit der Schlüssel/Werte/Löschungen der anderen Locale-Dateien verglichen werden (z. B. en, en_US). Jede Nicht-Basis-Datei, der Basis-Schlüssel fehlen, erhält Übersetzungsentwürfe; Schlüssel, die die Basis nicht mehr definiert, werden entfernt. Leer lassen, um die Basis pro Bundle-Familie automatisch zu erkennen — die implizite Standarddatei (ohne Suffix) wie messages.properties wird verwendet, wenn vorhanden, sonst die erste Locale-Datei. Ein leerer Wert wird unverändert gespeichert und fällt nicht auf einen Standard zurück.
workflow.i18n-coverage.param.maxToolRounds.description=Obergrenze für die Anzahl der Erkundungs-/Schreibrunden des Agenten. Höhere Werte erlauben größere Übersetzungsupdates bei höheren Tokenkosten.
workflow.i18n-coverage.param.suiteLifecycle.description=Was mit den generierten Übersetzungsänderungen geschehen soll.
workflow.readme-sync.param.includedFilePatterns.description=Durch Zeilenumbrüche oder Kommas getrennte Glob-Muster für den Dokumentationsumfang. Diese Muster definieren SOWOHL die gelesene Dokumentation ALS AUCH die zu erstellenden/ändernden/löschenden Dateien. Es werden nur Markdown-Dateien (*.md / *.markdown) erzeugt. Globs unterstützen ** (beliebige Pfadsegmente), * (innerhalb eines Segments) und ?. Übersetzte Varianten (z. B. README.de.md) werden eingeschlossen, wenn sie von einem Muster wie README.*.md abgedeckt sind.
workflow.readme-sync.param.maxToolRounds.description=Obergrenze für die Anzahl der Erkundungs-/Schreibrunden des Agenten. Höhere Werte erlauben größere Dokumentationsupdates bei höheren Tokenkosten.
workflow.readme-sync.param.suiteLifecycle.description=Was mit den generierten Dokumentationsänderungen geschehen soll.
