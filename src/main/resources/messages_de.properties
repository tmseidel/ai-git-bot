reviewQuality.def.counting=Zählregeln
reviewQuality.def.finalized=Nur agentische Reviews mit abgeschlossenem Datensatz zählen; fehlgeschlagene, abgebrochene und aufgegebene Läufe erscheinen nur unter "Review-Ergebnisse". Zurückgezogene Befunde zählen nie.
reviewQuality.def.pr=Ein PR wird je Git-Integration, Bot, Repository und Nummer gezählt, und zwar im Zeitraum seines ersten abgeschlossenen Reviews. Befundzahlen beziehen sich auf dieses erste Review, sodass ein fünfmal geprüfter PR genauso viel wiegt wie ein einmal geprüfter.
reviewQuality.def.feedback=Beim Feedback zählt der gültige Eintrag je Reviewer und Ziel; ersetzte und zurückgezogene Einträge gehören zum Verlauf.
reviewQuality.def.sample=Jede Quote zeigt beim Überfahren mit der Maus Zähler und Nenner; unter {0} Elementen zeigt sie "–" statt eines irreführenden Prozentwerts.
reviewQuality.def.resolution=Behoben, bestehend und neu
reviewQuality.def.matching=Wenn ein Review abgeschlossen wird, wird jeder Befund mit dem vorherigen Review desselben PR abgeglichen: gleiche Datei und Titel, die mindestens die Hälfte ihrer Wörter teilen – oder gleiche Kategorie, nahe beieinanderliegende Zeilen und einige gemeinsame Wörter. Eine Heuristik, kein Beweis, dass dasselbe Problem gemeint war.
reviewQuality.def.cost=Kosten und Nutzen
reviewQuality.def.costText=Die Kosten sind der Token-Verbrauch der Läufe agentischer Reviews (Reviews und Folgeantworten). Die Kosten jeder KI-Interaktion werden bei ihrer Erfassung mit den Token-Preisen ihrer KI-Integration berechnet und gespeichert; eine spätere Preisänderung, ein Modellwechsel oder eine Umbenennung ändert vergangene Kosten nie. Der Nutzen ist eine Schätzung aus den Annahmen im Tab "Kosten & Nutzen".
reviewQuality.def.notShown=Bewusst nicht angezeigt
reviewQuality.def.noScore=Ein einzelner "Codequalitäts-Score": Befunde hängen vom Modell, vom Prompt, von den Lektionen und von der Diff-Größe ab, und eine einzige Zahl würde das verbergen.
reviewQuality.def.noRanking=Ranglisten pro Autor: Die Autorentabelle muss ausdrücklich aktiviert werden, ist nach Name sortiert und wird nie mit einem Teamdurchschnitt verglichen.
reviewQuality.def.utc=Zeiträume und Intervalle sind in UTC; Wochen beginnen am Montag.
flash.aiPricesInvalid=Token-Preise müssen leer oder eine Zahl ab 0 sein.
