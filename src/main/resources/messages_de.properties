aiTest.connection.ok=Das Modell hat geantwortet: „{0}“
aiTest.connection.empty=Der Anbieter hat geantwortet, aber das Modell hat keinen Text geliefert. Prüfen Sie, ob es sich um ein Chat-Modell handelt.
aiTest.connection.emptyMaxTokens=Der Anbieter hat geantwortet, aber das Modell hat die maximalen Tokens verbraucht, bevor es Text erzeugt hat. Erhöhen Sie die maximalen Tokens; Reasoning-Modelle rechnen ihr Nachdenken auf dieses Limit an.
aiTest.tools.ok=Das Modell hat das Test-Tool aufgerufen. Natives Tool-Calling funktioniert.
aiTest.tools.disabled=Übersprungen: Natives Tool-Calling ist für diese Integration ausgeschaltet.
aiTest.tools.unsupportedProvider=Übersprungen: Dieser Anbieter verwendet immer das alte JSON-Tool-Format.
aiTest.tools.skippedAfterFailure=Übersprungen, weil der Verbindungstest fehlgeschlagen ist.
aiTest.tools.notCalled=Das Modell hat mit Text geantwortet, statt das Test-Tool aufzurufen. Agenten-Workflows funktionieren mit nativem Tool-Calling möglicherweise nicht; verwenden Sie ein anderes Modell oder schalten Sie natives Tool-Calling aus.
aiTest.tools.wrongTool=Das Modell hat statt des Test-Tools ein unbekanntes Tool „{0}“ aufgerufen. Natives Tool-Calling ist mit diesem Modell möglicherweise unzuverlässig.
aiTest.tools.rejected=Der Anbieter hat die Anfrage mit Tools abgelehnt (HTTP {0}). Modell oder Server unterstützen natives Tool-Calling wahrscheinlich nicht; schalten Sie es für diese Integration aus.
aiTest.error.providerMissing=Wählen Sie einen Anbieter aus.
aiTest.error.modelMissing=Geben Sie ein Modell ein.
aiTest.error.apiUrlMissing=Geben Sie eine API-URL ein.
aiTest.error.apiKeyMissing=Dieser Anbieter benötigt einen API-Schlüssel. Geben Sie einen ein, um den Test auszuführen.
aiTest.error.providerChangedNeedsKey=Der Anbieter wurde geändert. Geben Sie einen API-Schlüssel für den neuen Anbieter ein, um den Test auszuführen.
aiTest.error.configuration=Ungültige Einstellungen: {0}
aiTest.error.unauthorized=Der Anbieter hat den API-Schlüssel abgelehnt (HTTP {0}). Prüfen Sie den Schlüssel und seine Berechtigungen.
aiTest.error.notFound=Der Anbieter hat HTTP {0} zurückgegeben. Prüfen Sie die API-URL und den Modellnamen.
aiTest.error.proxyAuth=Ein Proxy verlangt eine Anmeldung (HTTP {0}). Konfigurieren Sie die Proxy-Zugangsdaten für ausgehende Verbindungen.
aiTest.error.rateLimited=Der Anbieter drosselt diesen Schlüssel oder sein Kontingent ist aufgebraucht (HTTP {0}).
aiTest.error.serverError=Der Anbieter meldet einen Serverfehler (HTTP {0}). Versuchen Sie es später erneut.
aiTest.error.http=Der Anbieter hat die Anfrage abgelehnt (HTTP {0}). Prüfen Sie Modellnamen, maximale Tokens und API-Version.
aiTest.error.unknownHost=Der Hostname konnte nicht aufgelöst werden: {0}. Prüfen Sie die API-URL und die DNS-Einstellungen des Servers.
aiTest.error.tls=Die TLS-Verbindung ist fehlgeschlagen: {0}. Das Zertifikat ist möglicherweise selbstsigniert, abgelaufen oder wird von einem Proxy ersetzt; fügen Sie die CA dem Truststore hinzu.
aiTest.error.connectTimeout=Zeitüberschreitung beim Verbindungsaufbau. Eine Firewall oder ein Proxy blockiert möglicherweise ausgehende Verbindungen, oder die API-URL zeigt auf den falschen Host oder Port.
aiTest.error.readTimeout=Der Server hat die Verbindung angenommen, aber das Modell hat nicht rechtzeitig geantwortet. Das Modell wird möglicherweise noch geladen, die Hardware ist langsam oder ein Reasoning-Modell denkt sehr lange nach. Testen Sie erneut, sobald das Modell geladen ist, oder erhöhen Sie HTTP_CLIENT_READ_TIMEOUT.
aiTest.error.connectionRefused=Die Verbindung wurde abgelehnt oder der Host ist nicht erreichbar. Prüfen Sie API-URL, Port sowie Firewall und Proxy.
aiTest.error.unexpected=Der Test ist fehlgeschlagen: {0}
