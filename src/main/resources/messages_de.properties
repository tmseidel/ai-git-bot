reviewQuality.cost.noPrices=Keine Nutzung dieses Zeitraums wurde mit Token-Preisen erfasst, daher wird sie in Tokens angezeigt. In einer KI-Integration hinterlegte Preise gelten für die Nutzung, die ab dann erfasst wird.
