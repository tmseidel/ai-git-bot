# Workflow names
workflow.review.name=PR-Review
workflow.agentic-review.name=Agentische PR-Review
workflow.unit-test-author.name=KI-Unit-Tests
workflow.readme-sync.name=README-Sync
workflow.i18n-coverage.name=i18n-Abdeckung
workflow.issue-triage.name=Issue-Triage
workflow.issue-coding.name=Coding-Agent
workflow.issue-writer.name=Writer-Agent
workflow.e2e-test.name=E2E-Tests
workflow.review.description=Veröffentlicht eine KI-Code-Review als einzelnen PR-Kommentar beim Öffnen oder Aktualisieren einer Pull-Request, antwortet auf @-Erwähnungen und Inline-Review-Kommentare mit Folgegesprächen und genehmigt oder fordert Änderungen gemäß der konfigurierten Post-Review-Aktion an.
workflow.agentic-review.description=Prüft die Pull-Request mit einem LLM, das iterativ schreibgeschützte Repository- und MCP-Tools aufrufen kann, um Kontext zu sammeln, bevor es seine Ergebnisse als Markdown-Kommentar verfasst.
workflow.i18n-coverage.description=Erkennt, wenn i18n-Änderungen einer Pull-Request (hinzugefügte Schlüssel, geänderte Werte, gelöschte Schlüssel) nicht konsistent über die Locale-Dateien reflektiert werden, entwirft dann mit einem LLM-Agenten die fehlenden Übersetzungen pro Locale gegen eine konfigurierbare Basis-Locale und veröffentlicht eine kurze Zusammenfassung. Unterstützt messages_*.properties und i18n/*.json.
workflow.unit-test-author.description=Erzeugt White-Box-Unit-Tests für den Pull-Request-Diff, führt sie mit dem eigenen Test-Runner des Projekts aus und committet (optional) die bestandenen Tests auf den PR-Branch. Arbeitet auf einem Checkout des PR-Heads — keine Vorschau-Bereitstellung nötig.
workflow.e2e-test.description=Stellt eine Vorschau der Pull-Request auf ihrem konfigurierten Deployment-Ziel bereit, generiert und führt dann End-to-End-Tests gegen die Live-Vorschau aus und veröffentlicht eine Markdown-Zusammenfassung. Erfordert ein Deployment-Ziel; unterstützt die Slash-Befehle re-run / regenerate.
workflow.readme-sync.description=Erkennt, wenn Code-Änderungen einer Pull-Request die Markdown-Dokumentation des Projekts ungenau oder veraltet gemacht haben, aktualisiert, erstellt oder entfernt dann die relevanten Dokumente (im konfigurierten Umfang) mit einem LLM-Agenten und veröffentlicht eine kurze Zusammenfassung. Nur Markdown; geänderte Dateien sind auf die konfigurierten Muster beschränkt.
workflow.issue-writer.description=Verfeinert das zugewiesene Issue mit dem Writer-Agenten zu einem klar spezifizierten, testbaren Issue und beantwortet Folgefragen in Issue-Kommentaren.
workflow.issue-coding.description=Implementiert das zugewiesene Issue mit dem Coding-Agenten (Workspace, Branch und Pull-Request) und setzt die Implementierung in Folge-Kommentaren fort.
workflow.issue-triage.description=Leitet ein neues oder neu zugewiesenes Issue mit einem Agenten an den richtigen Bearbeiter weiter (Person, Bot oder keiner), der zuerst Repository-/Issue-Kontext sammelt, dann den Weiterleitungsgrund als Kommentar veröffentlicht und die Zuweisung vornimmt. Implementiert das Issue selbst nie.
