help.hook.url=Muss mit <code>http://</code> oder <code>https://</code> beginnen. Zustellungen werden hier mit JSON-Body gepostet; jede 2xx-Antwort gilt als Erfolg.
help.hook.eventTypes=Mindestens eines. Der Endpunkt erhält jedes ausgewählte Ereignis, das seinem unten stehenden Umfang entspricht.
help.hook.customHeaders=Wird mit jeder Zustellung gesendet. Muss ein einzelnes JSON-Objekt sein. Bei konfiguriertem <code>APP_ENCRYPTION_KEY</code> verschlüsselt gespeichert; beim Bearbeiten leer lassen, um den aktuellen Wert zu behalten.
