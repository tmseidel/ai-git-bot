button.testConnection=Verbindung testen
aiTest.heading=Prüfungen
aiTest.running=Die Verbindung wird getestet. Lokale Modelle, die noch geladen werden oder auf langsamer Hardware laufen, können mehrere Minuten brauchen…
aiTest.hint=Testet die oben eingegebenen Werte. Es wird nichts gespeichert, und der Test zählt nicht zur Nutzungsstatistik.
