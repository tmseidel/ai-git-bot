help.botTools.defaultInfo=Dies ist die <strong>Standard</strong>-Tool-Konfiguration. Sie enthält immer alle registrierten integrierten Tools und kann nicht umbenannt oder gelöscht werden. Ihre Tool-Auswahl wird automatisch verwaltet; erstellen Sie eine neue Konfiguration, um die einem Bot bereitgestellten Tools einzuschränken.
help.botTools.defaultSelectionInfo=Die <strong>Standard</strong>-Tool-Konfiguration enthält immer alle registrierten integrierten Tools und ist schreibgeschützt. Klonen Sie sie, um eine angepasste Teilmenge zu erstellen.
help.prompt.reviewAgentInfo=Wird vom <strong>Agentic-PR-Review</strong>-Workflow verwendet. Bearbeiten Sie nur die <strong>Rollenbeschreibung</strong> des Agenten — das schreibgeschützte Tool-Protokoll (verfügbare Tools und Aufrufkonventionen) wird von der Software angehängt und ist hier <strong>nicht</strong> editierbar.
help.prompt.e2ePlannerInfo=Wird vom Full-Stack-QA-Workflow verwendet. Bearbeiten Sie nur die <strong>Rollenbeschreibung</strong> des Agenten — das technische Protokoll (aktives Framework, JSON-Ausgabeschema, Tool-Namen und Aufrufsequenz, URL-Konventionen) wird immer von der Software angehängt und ist hier <strong>nicht</strong> editierbar, damit eine Bearbeitung die Pipeline nicht beschädigen kann.
