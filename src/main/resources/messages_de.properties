help.bot.systemPrompt=Wählen Sie den Prompt-Satz für Code-Reviews, Coding-Agent-Implementierungen und Writer-Agent-Workflows.
help.bot.mcpConfiguration=Optionale Remote-MCP-Tools. Nur ausgewählte Tools werden dem Prompt bereitgestellt.
help.bot.toolConfiguration=Whitelist der integrierten Agent-Tools (Datei, Kontext, Validierung, Repository), die dieser Bot der KI bereitstellen darf. Nur aktivierte Tools werden dem Modell angekündigt und sind zur Laufzeit ausführbar.
help.bot.workflowConfiguration=Welche Workflows bei Pull-Request-Webhooks ausgeführt werden (Reviews, Testgenerierung, ...). Leer lassen, um den Standard zu erben (nur Review). Wählen Sie die leere Konfiguration "No PR workflows", um den Bot bei PRs stummzuschalten.
help.bot.runOnPrCreation=Wenn aktiviert, führt der Bot seinen konfigurierten PR-Workflow aus, wenn eine Pull-Request erstellt oder geöffnet wird, auch wenn er nicht als Reviewer zugewiesen ist.
help.bot.runOnPrUpdate=Wenn aktiviert, führt der Bot seinen konfigurierten PR-Workflow bei jedem <code>synchronized</code>-Ereignis aus (neue Commits auf dem PR-Branch). Nur auf GitHub und Gitea unterstützt. Bestehende Installationen sind standardmäßig deaktiviert.
help.bot.issueWorkflow=Was dieser Bot ausführt, wenn er einem Issue zugewiesen wird, und wie er Folgekommentare behandelt (z. B. Coding Agent implementiert das Issue, Writer Agent verfeinert es). Unabhängig von der obigen PR-Workflow-Konfiguration.
help.bot.runOnIssueCreation=Wenn aktiviert, führt der Bot seinen konfigurierten Issue-Workflow aus, wenn ein Issue erstellt wird, auch wenn er dem Issue nicht zugewiesen ist.
help.bot.deploymentTarget=Per-PR-Vorschauumgebung, die von Workflows mit Live-Deployment verwendet wird (z. B. E2E-Tests). Verwalten Sie Ziele unter
help.bot.userWhitelist=Git-Benutzernamen, die KI-kostenpflichtige Interaktionen mit diesem Bot auslösen dürfen (PR-Öffnungen/Syncs, <code>@</code>-Erwähnungen, Inline-Kommentare, Agent-Issue-Arbeit). Ein Benutzername pro Zeile oder kommagetrennt; Groß-/Kleinschreibung wird ignoriert. <strong>Leer lassen, um allen zu erlauben</strong> (historischer Standard). Empfohlen für <strong>öffentliche Repositories</strong>, damit Unbekannte die KI-Tokens des Bots nicht verbrauchen können.
help.bot.webhookSigningSecret=Wenn gesetzt, prüft der Bot die Webhook-Signatur des Anbieters (<code>X-Hub-Signature-256</code> für GitHub, <code>X-Gitea-Signature</code> für Gitea, <code>X-Gitlab-Token</code> für GitLab, <code>X-Hub-Signature</code> für Bitbucket) und weist gefälschte Ereignisse zurück. Konfigurieren Sie dasselbe Geheimnis in den Webhook-Einstellungen des Anbieters. Bei konfiguriertem <code>APP_ENCRYPTION_KEY</code> verschlüsselt gespeichert. <strong>Dringend empfohlen für öffentliche Repositories.</strong>
help.bot.aiIntegrationMissing=<strong>KI-Integration</strong> — verbindet den Bot mit einem KI-Anbieter (Anthropic, OpenAI, Google, ...).
help.bot.gitIntegrationMissing=<strong>Git-Integration</strong> — verbindet den Bot mit einer Git-Plattform (Gitea, GitHub, GitLab, ...).
popover.toolCalling.title=Tool-Calling-Modus
popover.toolCalling.content=<p><strong>Ein (Standard, empfohlen)</strong>: Tool-Deskriptoren werden über die native Function-Calling-API des Anbieters gesendet (Anthropic <code>tools</code>, OpenAI/Ollama <code>tool_calls</code>, Google <code>functionDeclarations</code>). Das Modell liefert strukturierte Tool-Aufrufe, die die Agent-Schleife direkt ausführt. Dies ist der empfohlene Weg für Frontier-Modelle — token-effizienter und zuverlässiger in agentischen Workflows.</p><p><strong>Aus (Legacy-Fallback)</strong>: Der Tool-Katalog wird im System-Prompt beschrieben und das Modell soll mit einem JSON-Block antworten, den der Agent selbst parst. Nur darauf zurückfallen, wenn natives Tool-Calling in Ihren agentischen Workflows nicht zuverlässig funktioniert — z. B. bei schwächeren/kleineren Modellen oder manchen selbst gehosteten Backends.</p><p>llama.cpp läuft unabhängig von diesem Schalter immer im Legacy-Modus. Siehe <code>doc/TOOL_CALLING.md</code> für das vollständige Troubleshooting-Playbook.</p>
popover.promptCaching.title=Prompt-Caching
popover.promptCaching.content=<p><strong>Ein (Standard, empfohlen)</strong>: Der Client setzt Cache-Breakpoints auf den System-Prompt und das rollierende Ende der Konversation. Agentische Workflows senden bei jeder Runde das gesamte Prompt-Präfix (System-Prompt + Diff + alle bisherigen Tool-Ergebnisse) erneut; mit Caching werden wiederholte Präfixe als Cache-Lesungen zu etwa 1/10 des Eingabepreises statt zum vollen Preis abgerechnet, was die Review-Kosten auf einen Bruchteil senkt.</p><p><strong>Aus</strong>: Jede Anfrage wird zum vollen Eingabepreis abgerechnet. Nur deaktivieren, wenn Ihr Anbieter-Endpunkt das Feld <code>cache_control</code> ablehnt.</p><p>Derzeit unterstützt nur der Anthropic-Anbieter Prompt-Caching; andere Anbieter ignorieren diesen Schalter.</p>
help.ai.contextWindow=Gesamtgröße des Kontextfensters des Modells. Wird für die proaktive Verlaufskomprimierung verwendet.
help.ai.toolCalling=Empfohlen für Frontier-Modelle — natives Function-Calling ist der Standard und der token-effizienteste, zuverlässigste Weg in agentischen Workflows. Nur deaktivieren, um auf das Legacy-JSON-in-Prompt-Tooling zurückzufallen, wenn natives Tool-Calling Probleme macht (z. B. bei schwächeren Modellen oder manchen selbst gehosteten Backends).
help.ai.promptCaching=Nur Anthropic Claude — zwischengespeicherte Prompt-Präfixe werden zu einem deutlich niedrigeren Satz abgerechnet, was die Kosten agentischer Reviews erheblich senkt. Von Anbietern ohne Caching-API ignoriert.
