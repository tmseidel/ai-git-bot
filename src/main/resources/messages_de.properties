help.hook.secret=Optional. Wenn gesetzt, werden Zustellungen mit <code>X-EventHook-Signature-256</code> signiert.
help.hook.keepSecret=Leer lassen, um das aktuelle Geheimnis zu behalten.
help.hook.authorizationHeader=Optionaler statischer <code>Authorization</code>-Header-Wert, z. B. <code>Bearer token123456</code> oder <code>Basic YWxhZGRpbjpvcGVuc2VzYW1l</code>.
