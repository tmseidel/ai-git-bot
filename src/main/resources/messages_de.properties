workflow.unit-test-author.param.maxRetries.description=Wie oft eine fehlgeschlagene Suite vor der Fehlermeldung erneut ausgeführt wird (0-5).
workflow.unit-test-author.param.maxTestCases.description=Kostenbegrenzung — unabhängig vom Wert auf ein festes Maximum begrenzt.
workflow.unit-test-author.param.suiteLifecycle.description=Was mit den generierten Tests geschehen soll.
workflow.issue-triage.param.systemPrompt.description=Routing-Anweisungen für das Triage-Modell. MUSS vor der Verwendung geprüft werden: Rollenbeschreibungen, Kontonamen und Bot-Namen prüfen und sicherstellen, dass jedes aufgelistete Konto im verbundenen Git-Provider existiert und zuweisbar ist. Halten Sie die Kontonamen synchron mit den unten erlaubten Bearbeitern.
workflow.issue-triage.param.assignees.description=Kommagetrennte Kontonamen, denen der Workflow Issues zuweisen darf. 'none' ist immer erlaubt und bedeutet: den Grund veröffentlichen, aber das Issue nicht zuweisen.
