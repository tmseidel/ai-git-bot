# Workflow param field descriptions
workflow.review.param.maxDiffCharsPerChunk.description=Caracteres máximos por bloque de diff antes de dividir. El diff completo de la PR se divide en bloques de este tamaño para la revisión.
workflow.review.param.maxDiffChunks.description=Número máximo de bloques de diff a revisar. Los bloques adicionales más allá de este límite se omiten.
workflow.review.param.retryTruncatedChunkChars.description=Cuando un bloque es demasiado grande para la ventana de contexto del modelo (error de prompt demasiado largo), el bloque se trunca a esta cantidad de caracteres y se reintenta una vez.
workflow.review.param.excludedFilePatterns.description=Patrones glob o de nombre de archivo separados por comas para excluir archivos del diff de revisión (p. ej. *.lock, *.min.js, package-lock.json, **/generated/**). Las secciones coincidentes se eliminan antes de enviar el diff a la IA, reduciendo el consumo de tokens y el ruido. Déjalo vacío para revisar todos los archivos.
workflow.agentic-review.param.maxToolRounds.description=Límite superior de rondas de exploración/respuesta que el agente puede realizar.
workflow.agentic-review.param.enableFormalReviewDecision.description=Cuando está activado, el bot puede publicar una decisión formal de revisión de la PR.
workflow.agentic-review.param.formalReviewDecisionPrompt.description=Criterios que usa el modelo para clasificar los hallazgos por gravedad.
workflow.agentic-review.param.blockerThreshold.description=Número máximo de hallazgos BLOCKER permitidos para una APROBACIÓN formal. Déjalo vacío para ignorar.
workflow.agentic-review.param.mediumThreshold.description=Número máximo de hallazgos MEDIOS permitidos para una APROBACIÓN formal. Déjalo vacío para ignorar.
workflow.agentic-review.param.lowThreshold.description=Número máximo de hallazgos BAJOS permitidos para una APROBACIÓN formal. Déjalo vacío para ignorar.
workflow.e2e-test.param.framework.description=playwright (predeterminado, bien probado) — pytest, k6, cypress son experimentales y solo probados superficialmente.
workflow.e2e-test.param.maxRetries.description=Presupuesto de reintentos por prueba. Una prueba que pasa tras reintentos se marca como FLAKY.
workflow.e2e-test.param.maxTestCases.description=Límite de coste — limitado a un máximo fijo independientemente del valor configurado.
workflow.e2e-test.param.suiteLifecycle.description=Qué ocurre con la suite generada después de cerrar la PR.
workflow.e2e-test.param.promotionThresholdPercent.description=Porcentaje mínimo de casos de prueba ejecutados que deben aprobar para que la suite se promueva (aplica a offer-as-pr / commit-to-pr / promote-on-merge). 100 (predeterminado) significa que solo se promueven suites totalmente verdes; bájalo a p. ej. 80 para promover también cuando aprueba al menos el 80 % de las pruebas. Las suites con ERROR o SKIPPED nunca se promueven independientemente de este valor. Consejo: las pruebas generadas por LLM rara vez son 100 % ejecutables al primer intento — trátalas como una base de pruebas de regresión, no como una verdad absoluta.
workflow.i18n-coverage.param.includedFilePatterns.description=Patrones glob separados por saltos de línea o comas que identifican los archivos de locale i18n. Estos patrones definen TANTO los archivos inspeccionados COMO los que se permite crear/actualizar/eliminar. Solo se producen archivos de locale (*.properties / *.json). Los globs admiten ** (segmentos de ruta), * (dentro de un segmento) y ?. Ejemplos: messages_*.properties, i18n/*.json.
workflow.i18n-coverage.param.baselineLocale.description=Opcional. El locale de referencia con cuyas claves/valores/eliminaciones se comparan los demás archivos de locale (p. ej. en, en_US). Todo archivo no base al que le falten claves recibe traducciones borrador; las claves que la base ya no define se eliminan. Déjalo en blanco para autodetectar la base por familia de bundles — se usa el archivo implícito (sin sufijo) como messages.properties cuando existe; si no, el primer archivo de locale. Un valor vacío se guarda tal cual y no vuelve a un valor predeterminado.
workflow.i18n-coverage.param.maxToolRounds.description=Límite superior de rondas de exploración/escritura del agente. Valores más altos permiten actualizaciones de traducción mayores a mayor coste de tokens.
workflow.i18n-coverage.param.suiteLifecycle.description=Qué hacer con los cambios de traducción generados.
workflow.readme-sync.param.includedFilePatterns.description=Patrones glob separados por saltos de línea o comas que definen el alcance de la documentación. Estos patrones definen TANTO la documentación leída COMO los archivos que se permite crear/actualizar/eliminar. Solo se producen archivos Markdown (*.md / *.markdown). Los globs admiten ** (segmentos de ruta), * (dentro de un segmento) y ?. Las variantes traducidas (p. ej. README.de.md) se incluyen cuando las cubre un patrón como README.*.md.
workflow.readme-sync.param.maxToolRounds.description=Límite superior de rondas de exploración/escritura del agente. Valores más altos permiten actualizaciones de documentación mayores a mayor coste de tokens.
workflow.readme-sync.param.suiteLifecycle.description=Qué hacer con los cambios de documentación generados.
workflow.unit-test-author.param.framework.description=Déjalo en auto para detectar la cadena de herramientas desde el repositorio, o fíjala explícitamente.
workflow.unit-test-author.param.maxRetries.description=Cuántas veces volver a ejecutar una suite fallida antes de informarla como fallida (0-5).
workflow.unit-test-author.param.maxTestCases.description=Límite de coste — limitado a un máximo fijo independientemente del valor.
workflow.unit-test-author.param.suiteLifecycle.description=Qué hacer con las pruebas generadas.
workflow.issue-triage.param.systemPrompt.description=Instrucciones de encaminamiento para el modelo de triaje. DEBE revisarse antes de usar: comprueba las descripciones de roles, los nombres de cuenta y de bot, y asegúrate de que cada cuenta listada exista y sea asignable en el proveedor Git conectado. Mantén los nombres de cuenta sincronizados con los asignados permitidos a continuación.
workflow.issue-triage.param.assignees.description=Nombres de cuenta separados por comas a los que el flujo puede asignar incidencias. 'none' siempre está permitido y significa: publicar el motivo pero dejar la incidencia sin asignar.
