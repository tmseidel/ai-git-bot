# Workflow names
workflow.review.name=Revisión de PR
workflow.agentic-review.name=Revisión de PR agéntica
workflow.unit-test-author.name=Pruebas unitarias de IA
workflow.readme-sync.name=Sincronización de README
workflow.i18n-coverage.name=Cobertura i18n
workflow.issue-triage.name=Triaje de incidencias
workflow.issue-coding.name=Agente de codificación
workflow.issue-writer.name=Agente redactor
workflow.e2e-test.name=Pruebas E2E
workflow.review.description=Publica una revisión de código con IA como un único comentario en la PR al abrirla o actualizarla, responde a @-menciones y comentarios de revisión en línea con seguimientos conversacionales y, opcionalmente, aprueba o solicita cambios según la acción posterior configurada.
workflow.agentic-review.description=Revisa la pull request con un LLM que puede invocar iterativamente herramientas de repositorio de solo lectura y MCP para reunir contexto antes de redactar sus hallazgos como comentario Markdown.
workflow.i18n-coverage.description=Detecta cuando los cambios de i18n de una pull request (claves añadidas, valores modificados, claves eliminadas) no se reflejan de forma coherente en los archivos de locale, redacta las traducciones que faltan por locale con un agente LLM tomando como referencia un locale base configurable y publica un resumen breve. Compatible con archivos messages_*.properties e i18n/*.json.
workflow.unit-test-author.description=Genera pruebas unitarias de caja blanca para el diff de la pull request, las ejecuta con el ejecutor de pruebas del propio proyecto y (opcionalmente) confirma las pruebas aprobadas en la rama de la PR. Funciona sobre un checkout de la cabeza de la PR — no requiere despliegue de vista previa.
workflow.e2e-test.description=Despliega una vista previa de la pull request en su destino de despliegue configurado, luego genera y ejecuta pruebas de extremo a extremo contra la vista previa en vivo y publica un resumen Markdown. Requiere un destino de despliegue; admite los comandos slash re-run / regenerate.
workflow.readme-sync.description=Detecta cuando los cambios de código de una pull request han dejado inexacta u obsoleta la documentación Markdown del proyecto, luego actualiza, crea o elimina los documentos relevantes (dentro del alcance configurado) con un agente LLM y publica un resumen breve. Solo Markdown; los archivos modificados se limitan a los patrones configurados.
workflow.issue-writer.description=Refina la incidencia asignada hasta convertirla en una incidencia bien especificada y comprobable con el agente redactor y responde preguntas de seguimiento en los comentarios.
workflow.issue-coding.description=Implementa la incidencia asignada con el agente de codificación (espacio de trabajo, rama y pull request) y continúa la implementación en los comentarios de seguimiento.
workflow.issue-triage.description=Encamina una incidencia nueva o recién asignada al destinatario correcto (persona, bot o ninguno) con un agente que reúne el contexto del repositorio/incidencia antes de decidir, publica el motivo del encaminamiento como comentario y realiza la asignación. Nunca implementa la incidencia en sí.
