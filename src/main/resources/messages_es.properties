help.hook.name=Etiqueta legible que se muestra en la lista de endpoints.
help.hook.url=Debe empezar por <code>http://</code> o <code>https://</code>. Las entregas se envían por POST aquí con un cuerpo JSON; cualquier respuesta 2xx cuenta como éxito.
help.hook.eventTypes=Al menos uno. El endpoint recibe cada evento marcado que coincide con su alcance a continuación.
help.hook.customHeaders=Se envía con cada entrega. Debe ser un único objeto JSON. Almacenado cifrado cuando <code>APP_ENCRYPTION_KEY</code> está configurada; déjalo en blanco al editar para conservar el valor actual.
help.hook.scope=Deja los tres vacíos para un endpoint global que recibe eventos de todos los bots y repositorios.
