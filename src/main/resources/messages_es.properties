help.ai.apiKeyRequiredEdit=Se requiere clave de API. Déjala en blanco solo para conservar la clave almacenada existente.
help.ai.apiKeyRequiredNew=Se requiere clave de API. Se almacenará cifrada cuando APP_ENCRYPTION_KEY esté configurada.
help.ai.apiKeyNotRequired=No se requiere clave de API para este proveedor.
