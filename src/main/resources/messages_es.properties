help.botTools.defaultInfo=Esta es la configuración de herramientas <strong>predeterminada</strong>. Siempre contiene todas las herramientas integradas registradas y no se puede renombrar ni eliminar. Su selección de herramientas se gestiona automáticamente; crea una nueva configuración para restringir las herramientas expuestas a un bot.
help.botTools.defaultSelectionInfo=La configuración de herramientas <strong>predeterminada</strong> siempre contiene todas las herramientas integradas registradas y es de solo lectura. Clónala para crear un subconjunto personalizado.
help.prompt.reviewAgentInfo=Utilizado por el flujo <strong>Revisión de PR agéntica</strong>. Edita solo la <strong>descripción del rol</strong> del agente — el protocolo de herramientas de solo lectura (herramientas disponibles y convenciones de llamada) lo añade el software y <strong>no</strong> es editable aquí.
help.prompt.e2ePlannerInfo=Utilizado por el flujo de control de calidad full-stack. Edita solo la <strong>descripción del rol</strong> del agente — el protocolo técnico (framework activo, esquema de salida JSON, nombres de herramientas y secuencia de llamada, convenciones de URL) siempre lo añade el software y <strong>no</strong> es editable aquí, de modo que una edición no pueda romper la canalización.
