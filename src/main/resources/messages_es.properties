help.bot.systemPrompt=Selecciona el conjunto de prompts utilizado para revisiones de código, implementaciones del agente de codificación y flujos del agente redactor.
help.bot.mcpConfiguration=Herramientas MCP remotas opcionales. Solo las herramientas seleccionadas se exponen al prompt.
help.bot.toolConfiguration=Lista blanca de herramientas de agente integradas (archivo, contexto, validación, repositorio) que este bot puede exponer a la IA. Solo las herramientas habilitadas se anuncian al modelo y son ejecutables en tiempo de ejecución.
help.bot.workflowConfiguration=Qué flujos se ejecutan en los webhooks de pull request (revisiones, generación de pruebas, ...). Déjalo vacío para heredar el predeterminado (solo revisión). Selecciona la configuración vacía "No PR workflows" para mantener el bot silencioso en las PR.
help.bot.runOnPrCreation=Cuando está activado, el bot ejecuta su flujo de PR configurado al crear o abrir una pull request, incluso si no está asignado como revisor.
help.bot.runOnPrUpdate=Cuando está activado, el bot ejecuta su flujo de PR configurado en cada evento <code>synchronized</code> (nuevos commits enviados a la rama de la PR). Solo compatible con GitHub y Gitea. En las instalaciones existentes, esta opción está desactivada por defecto.
help.bot.issueWorkflow=Qué hace este bot cuando se le asigna una incidencia y cómo maneja los comentarios de seguimiento (p. ej. el agente de codificación la implementa, el agente redactor la refina). Independiente de la configuración de flujo de PR anterior.
help.bot.runOnIssueCreation=Cuando está activado, el bot ejecuta su flujo de incidencia configurado al crear una incidencia, incluso si no está asignado a ella.
help.bot.deploymentTarget=Entorno de vista previa por PR utilizado por flujos que necesitan un despliegue en vivo (p. ej. pruebas E2E). Gestiona los destinos en
help.bot.userWhitelist=Nombres de usuario Git autorizados a desencadenar interacciones de IA de pago con este bot (aperturas/sincronizaciones de PR, <code>@</code>-menciones, comentarios en línea, trabajo de agente en incidencias). Un nombre por línea o separado por comas; la coincidencia no distingue mayúsculas. <strong>Déjalo vacío para permitir a todos</strong> (predeterminado histórico). Recomendado para <strong>repositorios públicos</strong> para que desconocidos no puedan gastar los tokens de IA del bot.
help.bot.webhookSigningSecret=Cuando está establecido, el bot verifica la firma de webhook del proveedor (<code>X-Hub-Signature-256</code> para GitHub, <code>X-Gitea-Signature</code> para Gitea, <code>X-Gitlab-Token</code> para GitLab, <code>X-Hub-Signature</code> para Bitbucket) y rechaza eventos falsificados. Configura el mismo secreto en los ajustes de webhook del proveedor. Almacenado cifrado cuando <code>APP_ENCRYPTION_KEY</code> está configurada. <strong>Muy recomendado para repositorios públicos.</strong>
help.bot.aiIntegrationMissing=<strong>Integración de IA</strong> — conecta el bot con un proveedor de IA (Anthropic, OpenAI, Google, ...).
help.bot.gitIntegrationMissing=<strong>Integración de Git</strong> — conecta el bot con una plataforma Git (Gitea, GitHub, GitLab, ...).
popover.toolCalling.title=Modo de llamada de herramientas
popover.toolCalling.content=<p><strong>Activado (predeterminado, recomendado)</strong>: los descriptores de herramientas se envían a través de la API nativa de llamada a funciones del proveedor (Anthropic <code>tools</code>, OpenAI/Ollama <code>tool_calls</code>, Google <code>functionDeclarations</code>). El modelo devuelve invocaciones de herramientas estructuradas que el bucle de agente despacha directamente. Es la ruta recomendada para modelos de vanguardia — más eficiente en tokens y más fiable en flujos agénticos.</p><p><strong>Desactivado (fallback heredado)</strong>: el catálogo de herramientas se describe en el prompt del sistema y se pide al modelo responder con un bloque JSON que el agente analiza. Solo recurre a esto si la llamada nativa no funciona de forma fiable — p. ej. con modelos más débiles/pequeños o algunos backends autoalojados.</p><p>llama.cpp siempre funciona en modo heredado independientemente de este interruptor. Consulta <code>doc/TOOL_CALLING.md</code> para el manual completo de resolución de problemas.</p>
popover.promptCaching.title=Almacenamiento en caché del prompt
popover.promptCaching.content=<p><strong>Activado (predeterminado, recomendado)</strong>: el cliente marca puntos de interrupción de caché en el prompt del sistema y en el tramo final más reciente de la conversación. Los flujos agénticos reenvían todo el prefijo del prompt (prompt del sistema + diff + todos los resultados de herramientas anteriores) en cada ronda; con caché, los prefijos repetidos se facturan como lecturas de caché a aproximadamente 1/10 del precio de entrada en lugar del precio completo, reduciendo el coste de revisión a una fracción.</p><p><strong>Desactivado</strong>: cada solicitud se factura al precio de entrada completo. Solo desactívalo si tu endpoint del proveedor rechaza el campo <code>cache_control</code>.</p><p>Actualmente solo el proveedor Anthropic admite caché de prompt; otros proveedores ignoran este interruptor.</p>
help.ai.contextWindow=Tamaño total de la ventana de contexto del modelo. Se usa para la compactación proactiva del historial.
help.ai.toolCalling=Recomendado para modelos de vanguardia — la llamada a funciones nativa es la predeterminada y la ruta más eficiente en tokens y fiable en flujos agénticos. Solo desactívalo para volver al sistema JSON-en-prompt heredado si la llamada nativa falla (p. ej. con modelos más débiles o algunos backends autoalojados).
help.ai.promptCaching=Solo Anthropic Claude — los prefijos de prompt en caché se facturan a una tarifa mucho menor, lo que reduce sustancialmente el coste de las revisiones agénticas. Ignorado por proveedores sin API de caché.
