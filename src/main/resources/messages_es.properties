reviewQuality.assumptions.saved=Se guardaron los supuestos.
reviewQuality.assumptions.invalid=No se guardaron los supuestos: los minutos deben estar entre 0 y 100.000, la tarifa por hora no puede ser negativa y la moneda necesita un código como USD o EUR.
reviewQuality.since.fingerprints=Resuelto / persistente / nuevo se registra para las revisiones desde {0}.
reviewQuality.since.fingerprints.none=Resuelto / persistente / nuevo se registra para las revisiones finalizadas a partir de ahora.
reviewQuality.since.diffSize=Los tamaños de diff se registran desde {0}.
reviewQuality.since.diffSize.none=Los tamaños de diff se registran para las revisiones a partir de ahora.
reviewQuality.since.runLinks=Las revisiones se vinculan a su uso de IA desde {0}.
reviewQuality.since.runLinks.none=Las revisiones se vinculan a su uso de IA a partir de ahora.
reviewQuality.since.outcomes=Las fusiones y los cierres se registran desde {0}.
reviewQuality.since.outcomes.none=Las fusiones y los cierres se registran a partir de ahora.
reviewQuality.since.authors=Los autores de PR se registran desde {0}.
reviewQuality.since.authors.none=Los autores de PR se registran para las revisiones a partir de ahora.
reviewQuality.def.counting=Reglas de recuento
reviewQuality.def.finalized=Solo cuentan las revisiones agénticas con un registro finalizado; las ejecuciones fallidas, canceladas y abandonadas solo aparecen en "Conclusiones de las revisiones". Los hallazgos retirados nunca cuentan.
reviewQuality.def.pr=Un PR se cuenta por integración de Git, bot, repositorio y número, en el periodo de su primera revisión finalizada. Las cifras de hallazgos usan esa primera revisión, así que un PR revisado cinco veces pesa lo mismo que uno revisado una vez.
reviewQuality.def.feedback=El feedback cuenta el registro vigente por revisor y objetivo; los registros reemplazados y retirados son historial.
reviewQuality.def.sample=Cada tasa muestra su numerador y denominador al pasar el ratón; por debajo de {0} elementos muestra "–" en lugar de un porcentaje engañoso.
reviewQuality.def.resolution=Resueltos, persistentes y nuevos
reviewQuality.def.matching=Cuando se finaliza una revisión, cada hallazgo se compara con la revisión anterior del mismo PR: mismo archivo y títulos que comparten al menos la mitad de sus palabras — o la misma categoría, líneas cercanas y algunas palabras en común. Es una heurística, no una prueba de que se trate del mismo problema.
reviewQuality.def.cost=Coste y retorno
reviewQuality.def.costText=El coste es el uso de tokens de las ejecuciones de revisión agéntica (revisiones y respuestas de seguimiento). El coste de cada interacción de IA se calcula con los precios de tokens de su integración de IA al registrarse y se guarda, así que un cambio posterior de precio, de modelo o de nombre nunca cambia el coste pasado. El retorno es una estimación a partir de los supuestos de la pestaña Coste.
reviewQuality.def.notShown=No se muestra a propósito
reviewQuality.def.noScore=Una única "puntuación de calidad del código": los hallazgos dependen del modelo, el prompt, las lecciones y el tamaño del diff, y un solo número lo ocultaría.
reviewQuality.def.noRanking=Clasificaciones por autor: la tabla de autores es opcional, está ordenada por nombre y nunca se compara con una media del equipo.
reviewQuality.def.utc=Los periodos y agrupaciones están en UTC; las semanas empiezan el lunes.
flash.aiPricesInvalid=Los precios de los tokens deben estar vacíos o ser un número mayor o igual que 0.
