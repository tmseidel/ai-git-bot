aiTest.error.unauthorized=El proveedor rechazó la clave de API (HTTP {0}). Compruebe la clave y sus permisos.
aiTest.error.notFound=El proveedor devolvió HTTP {0}. Compruebe la URL de API y el nombre del modelo.
aiTest.error.proxyAuth=Un proxy requiere autenticación (HTTP {0}). Configure las credenciales del proxy para las conexiones salientes.
aiTest.error.rateLimited=El proveedor está limitando esta clave o su cuota está agotada (HTTP {0}).
aiTest.error.serverError=El proveedor informó un error del servidor (HTTP {0}). Inténtelo más tarde.
aiTest.error.http=El proveedor rechazó la solicitud (HTTP {0}). Compruebe el nombre del modelo, los tokens máximos y la versión de API.
aiTest.error.unknownHost=No se pudo resolver el nombre de host: {0}. Compruebe la URL de API y la configuración DNS del servidor.
aiTest.error.tls=La conexión TLS falló: {0}. El certificado puede ser autofirmado, estar caducado o haber sido sustituido por un proxy; añada la CA al almacén de confianza.
aiTest.error.connectTimeout=Se agotó el tiempo de conexión antes de que el servidor respondiera. Un firewall o proxy puede estar bloqueando las conexiones salientes, o la URL de API apunta a un host o puerto incorrecto.
aiTest.error.readTimeout=El servidor aceptó la conexión, pero el modelo no respondió a tiempo. Puede que el modelo aún se esté cargando, que el hardware sea lento o que un modelo de razonamiento esté pensando mucho tiempo. Vuelva a probar cuando el modelo esté cargado o aumente HTTP_CLIENT_READ_TIMEOUT.
aiTest.error.connectionRefused=La conexión fue rechazada o el host no es accesible. Compruebe la URL de API, el puerto, el firewall y el proxy.
aiTest.error.unexpected=La prueba falló: {0}
