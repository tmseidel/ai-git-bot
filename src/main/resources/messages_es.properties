help.hook.name=Etiqueta legible que se muestra en la lista de endpoints.
help.hook.url=Debe empezar por <code>http://</code> o <code>https://</code>. Las entregas se envían por POST aquí con un cuerpo JSON; cualquier respuesta 2xx cuenta como éxito.
help.hook.eventTypes=Al menos uno. El endpoint recibe cada evento marcado que coincide con su alcance a continuación.
help.hook.customHeaders=Se envía con cada entrega. Debe ser un único objeto JSON. Almacenado cifrado cuando APP_ENCRYPTION_KEY está configurada; déjalo en blanco al editar para conservar el valor actual.
help.hook.scope=Deja los tres vacíos para un endpoint global que recibe eventos de todos los bots y repositorios.
help.hook.secret=Opcional. Cuando está establecido, las entregas se firman con <code>X-EventHook-Signature-256</code>.
help.hook.keepSecret=Déjalo en blanco para conservar el secreto actual.
help.hook.authorizationHeader=Valor de cabecera <code>Authorization</code> estática opcional, p. ej. <code>Bearer token123456</code> o <code>Basic YWxhZGRpbjpvcGVuc2VzYW1l</code>.
help.hook.keepValue=Déjalo en blanco para conservar el valor actual.
help.hook.skipTls=Inseguro: desactiva la validación del certificado HTTPS. Úsalo solo para endpoints autofirmados/internos.
help.git.urlDescription=La URL base de tu instancia de Gitea.
help.git.usernameUnresolved=Aún no determinado. El nombre de usuario se obtiene del proveedor con el token de la integración al iniciar, al guardar la integración y en el siguiente evento de webhook.
help.git.tokenRemoved=El token almacenado se eliminará al guardar.
help.git.tokenDescription=El token de acceso para la autenticación de la API.
help.git.reviewTrigger=Las revisiones de código solo se ejecutan cuando el bot se solicita explícitamente como revisor. Los nuevos commits no desencadenan revisiones de seguimiento automáticamente.
help.git.postReviewAction=Por defecto, sin acción automática de aprobar o solicitar cambios. Actualmente compatible con GitLab y Azure DevOps.
help.git.giteaUrl=La URL base de tu instancia de Gitea (p. ej. https://gitea.example.com).
help.git.giteaToken=Un token de acceso de Gitea con permisos de lectura/escritura del repositorio.
help.git.githubToken=Un token de acceso personal de GitHub (clásico) o un token de granularidad fina con permisos de repositorio.
help.git.gitlabUrl=La URL base de tu instancia de GitLab (p. ej. https://gitlab.com para gitlab.com, o https://gitlab.tudominio.com para autogestionado).
help.git.gitlabToken=Un token de acceso personal de GitLab con los ámbitos api y read_repository. Consulta Ajustes de GitLab → Tokens de acceso.
help.git.bitbucketToken=Un token de API de Atlassian con scopes de Bitbucket (id.atlassian.com → Seguridad → Crear token de API con scopes). Scopes necesarios: read:user:bitbucket, read:repository:bitbucket, write:repository:bitbucket, read:pullrequest:bitbucket, write:pullrequest:bitbucket.
help.git.azureDevopsToken=Un token de acceso personal de Azure DevOps con los ámbitos Code (read & write), Pull Request Threads (read & write) e Identity (read). Créalo en Configuración de usuario → Personal access tokens.
