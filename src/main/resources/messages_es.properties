help.deploymentTarget.callbackUrl=Las estrategias asíncronas (p. ej. <code>WEBHOOK</code>) deben llamar de vuelta al bot en esta URL cuando el entorno de vista previa esté listo. Los marcadores <code>{runId}</code> y <code>{secret}</code> se rellenan por solicitud y se incrustan en la carga del webhook saliente como <code>callbackUrl</code>.
help.deploymentTarget.publicBaseUrl=Establece la propiedad <code>ai-git-bot.public-base-url</code> (p. ej. <code>https://bot.acme.io</code>) para que el bot pueda entregar una URL completa.
help.deploymentTarget.name=Identificador único que se muestra en el desplegable del formulario del bot.
help.deploymentTarget.previewUrlTemplate=Opcional. Obligatorio para <code>STATIC</code>; informativo para <code>WEBHOOK</code>. Marcadores: <code>{prNumber}</code>, <code>{sha}</code>, <code>{branch}</code>.
help.deploymentTarget.timeout=Tiempo máximo que el orquestador espera la estrategia / la devolución de llamada.
help.deploymentTarget.strategyConfig=<strong>WEBHOOK</strong>: <code>{ "webhookUrl": "&lt;url&gt;", "sharedSecret": "&lt;hex&gt;", "headers": { ... } }</code>.<br/><strong>STATIC</strong>: <code>{ "healthcheckPath": "/healthz", "expectedStatus": 200, "intervalSeconds": 5, "extraHeaders": { ... } }</code>.<br/><strong>MCP</strong> <em>(experimental)</em>: <code>{ "mcpConfigurationId": &lt;id&gt;, "deployTool": "&lt;nombre-cualificado&gt;", "statusTool": "&lt;nombre-cualificado&gt;", "teardownTool": "&lt;nombre-cualificado&gt;", "argsTemplate": { "branch": "{branch}", "sha": "{sha}" } }</code>. Todos los nombres de herramientas deben estar en la lista blanca de la configuración MCP referenciada — de lo contrario se rechaza el guardado.<br/><strong>CI_ACTION</strong>: <code>{ "workflowRef": "preview.yml", "refTemplate": "refs/heads/{branch}", "previewUrlOutput": "preview_url", "pollIntervalSeconds": 15, "inputs": { "callbackUrl": "{callbackUrl}" } }</code>. <code>workflowRef</code> es el archivo de workflow (GitHub / Gitea Actions), el token de activación de pipeline (GitLab CI) o el patrón de pipeline personalizado (Bitbucket Pipelines). <code>refTemplate</code> debe resolver a una <em>rama o etiqueta</em> que ya exista en el remoto (por defecto: <code>refs/heads/{branch}</code>) — Gitea, GitLab y Bitbucket rechazan refs de pull request como <code>refs/pull/N/head</code> al enviar. GitHub Actions además admite <code>refs/pull/{prNumber}/head</code> (necesario para PR de forks). Consulta <a href="https://github.com/tmseidel/ai-git-bot/blob/main/doc/PR_WORKFLOWS_CI_ACTIONS.md" target="_blank">doc/PR_WORKFLOWS_CI_ACTIONS.md</a> para una receta por proveedor.<br/>Consulta <a href="https://github.com/tmseidel/ai-git-bot/blob/main/doc/PR_WORKFLOWS.md" target="_blank">doc/PR_WORKFLOWS.md → Deployment targets</a> para el esquema completo.
