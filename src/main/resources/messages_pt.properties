help.botTools.defaultInfo=Esta é a configuração de ferramentas <strong>padrão</strong>. Ela sempre contém todas as ferramentas integradas registradas e não pode ser renomeada nem excluída. Sua seleção de ferramentas é gerenciada automaticamente; crie uma nova configuração para restringir as ferramentas expostas a um bot.
help.botTools.defaultSelectionInfo=A configuração de ferramentas <strong>padrão</strong> sempre contém todas as ferramentas integradas registradas e é somente leitura. Clone-a para criar um subconjunto personalizado.
help.prompt.reviewAgentInfo=Usado pelo fluxo <strong>Revisão de PR por agente</strong>. Edite apenas a <strong>descrição do papel</strong> do agente — o protocolo de ferramentas somente leitura (ferramentas disponíveis e convenções de chamada) é anexado pelo software e <strong>não</strong> é editável aqui.
help.prompt.e2ePlannerInfo=Usado pelo fluxo de QA full-stack. Edite apenas a <strong>descrição do papel</strong> do agente — o protocolo técnico (framework ativo, esquema de saída JSON, nomes de ferramentas e sequência de chamada, convenções de URL) é sempre anexado pelo software e <strong>não</strong> é editável aqui, para que uma edição não possa quebrar o pipeline.
