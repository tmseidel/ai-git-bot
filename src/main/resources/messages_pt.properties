# Workflow names
workflow.review.name=Revisão de PR
workflow.agentic-review.name=Revisão de PR por agente
workflow.unit-test-author.name=Testes unitários de IA
workflow.readme-sync.name=Sincronização de README
workflow.i18n-coverage.name=Cobertura i18n
workflow.issue-triage.name=Triagem de issues
workflow.issue-coding.name=Agente de codificação
workflow.issue-writer.name=Agente redator
workflow.e2e-test.name=Testes E2E
workflow.review.description=Publica uma revisão de código com IA como um único comentário na PR ao abri-la ou atualizá-la, responde a @-menções e comentários de revisão em linha com acompanhamentos conversacionais e, opcionalmente, aprova ou solicita alterações conforme a ação pós-revisão configurada.
workflow.agentic-review.description=Revisa a pull request com um LLM que pode invocar iterativamente ferramentas de repositório somente leitura e MCP para reunir contexto antes de escrever seus achados como um comentário Markdown.
workflow.i18n-coverage.description=Detecta quando as alterações de i18n de uma pull request (chaves adicionadas, valores alterados, chaves excluídas) não são refletidas de forma consistente nos arquivos de locale, então elabora as traduções ausentes por locale com um agente LLM a partir de um locale base configurável e publica um resumo curto. Compatível com messages_*.properties e i18n/*.json.
workflow.unit-test-author.description=Gera testes unitários de caixa branca para o diff da pull request, executa-os com o runner de testes do próprio projeto e (opcionalmente) faz commit dos testes aprovados na branch da PR. Funciona em um checkout do head da PR — sem necessidade de implantação de visualização.
workflow.e2e-test.description=Implanta uma visualização da pull request no seu alvo de implantação configurado, então gera e executa testes de ponta a ponta contra a visualização ao vivo e publica um resumo Markdown. Requer um alvo de implantação; oferece suporte aos comandos slash re-run / regenerate.
workflow.readme-sync.description=Detecta quando as alterações de código de uma pull request tornaram a documentação Markdown do projeto imprecisa ou desatualizada, então atualiza, cria ou remove os documentos relevantes (dentro do escopo configurado) com um agente LLM e publica um resumo curto. Somente Markdown; os arquivos alterados são restritos aos padrões configurados.
workflow.issue-writer.description=Refina a issue atribuída em uma issue bem especificada e testável com o agente redator e responde a perguntas de acompanhamento nos comentários.
workflow.issue-coding.description=Implementa a issue atribuída com o agente de codificação (espaço de trabalho, branch e pull request) e continua a implementação nos comentários de acompanhamento.
workflow.issue-triage.description=Encaminha uma issue nova ou recém-atribuída ao responsável correto (pessoa, bot ou nenhum) com um agente que reúne o contexto do repositório/issue antes de decidir, publica o motivo do encaminhamento como comentário e realiza a atribuição. Nunca implementa a issue em si.
