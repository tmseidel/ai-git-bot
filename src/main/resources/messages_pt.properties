# Workflow param field descriptions
workflow.review.param.maxDiffCharsPerChunk.description=Caracteres máximos por bloco de diff antes de dividir. O diff completo da PR é dividido em blocos deste tamanho para a revisão.
workflow.review.param.maxDiffChunks.description=Número máximo de blocos de diff a revisar. Os blocos além deste limite são ignorados.
workflow.review.param.retryTruncatedChunkChars.description=Quando um bloco é grande demais para a janela de contexto do modelo (erro de prompt muito longo), ele é truncado para esta quantidade de caracteres e repetido uma vez.
workflow.review.param.excludedFilePatterns.description=Padrões glob ou de nome de arquivo separados por vírgula para excluir arquivos do diff de revisão (ex. *.lock, *.min.js, package-lock.json, **/generated/**). As seções correspondentes são removidas antes do envio do diff à IA, reduzindo o consumo de tokens e o ruído. Deixe em branco para revisar todos os arquivos.
workflow.agentic-review.param.maxToolRounds.description=Limite superior de rodadas de exploração/resposta que o agente pode realizar.
workflow.agentic-review.param.enableFormalReviewDecision.description=Quando ativado, o bot pode publicar uma decisão formal de revisão da PR.
workflow.agentic-review.param.formalReviewDecisionPrompt.description=Critérios que o modelo usa para classificar os achados por gravidade.
workflow.agentic-review.param.blockerThreshold.description=Número máximo de achados BLOCKER permitidos para uma APROVAÇÃO formal. Deixe vazio para ignorar.
workflow.agentic-review.param.mediumThreshold.description=Número máximo de achados MÉDIOS permitidos para uma APROVAÇÃO formal. Deixe vazio para ignorar.
workflow.agentic-review.param.lowThreshold.description=Número máximo de achados BAIXOS permitidos para uma APROVAÇÃO formal. Deixe vazio para ignorar.
workflow.e2e-test.param.framework.description=playwright (padrão, bem testado) — pytest, k6, cypress são experimentais e apenas testados superficialmente.
workflow.e2e-test.param.maxRetries.description=Orçamento de tentativas por teste. Um teste que passa após tentativas é marcado como FLAKY.
workflow.e2e-test.param.maxTestCases.description=Limite de custo — limitado a um máximo fixo independentemente do valor configurado.
workflow.e2e-test.param.suiteLifecycle.description=O que acontece com a suíte gerada após o fechamento da PR.
workflow.e2e-test.param.promotionThresholdPercent.description=Percentual mínimo de casos de teste executados que devem passar para a suíte ser promovida (aplica-se a offer-as-pr / commit-to-pr / promote-on-merge). 100 (padrão) significa que apenas suítes totalmente verdes são promovidas; reduza para, por exemplo, 80 para promover também quando ao menos 80 % dos testes passarem. Suítes com ERROR ou SKIPPED nunca são promovidas, independentemente deste valor. Dica: testes gerados por LLM raramente são 100 % executáveis na primeira tentativa — trate-os como uma base de testes de regressão, não como verdade absoluta.
workflow.i18n-coverage.param.includedFilePatterns.description=Padrões glob separados por quebras de linha ou vírgulas que identificam os arquivos de locale i18n. Esses padrões definem TANTO os arquivos inspecionados QUANTO os permitidos para criar/atualizar/excluir. Apenas arquivos de locale (*.properties / *.json) são produzidos. Globs suportam ** (segmentos de caminho), * (dentro de um segmento) e ?. Exemplos: messages_*.properties, i18n/*.json.
workflow.i18n-coverage.param.baselineLocale.description=Opcional. O locale de referência com cujas chaves/valores/exclusões os demais arquivos de locale são comparados (ex. en, en_US). Todo arquivo não-base sem chaves da base recebe traduções esboçadas; as chaves que a base não define mais são removidas. Deixe em branco para autodetectar a base por família de bundle — o arquivo implícito (sem sufixo) como messages.properties é usado quando presente, senão o primeiro arquivo de locale. Um valor em branco é salvo como está e não voltará a um padrão.
workflow.i18n-coverage.param.maxToolRounds.description=Limite superior de rodadas de exploração/escrita do agente. Valores maiores permitem atualizações de tradução maiores a um custo maior de tokens.
workflow.i18n-coverage.param.suiteLifecycle.description=O que fazer com as alterações de tradução geradas.
workflow.readme-sync.param.includedFilePatterns.description=Padrões glob separados por quebras de linha ou vírgulas que definem o escopo da documentação. Esses padrões definem TANTO a documentação lida QUANTO os arquivos permitidos para criar/atualizar/excluir. Apenas arquivos Markdown (*.md / *.markdown) são produzidos. Globs suportam ** (segmentos de caminho), * (dentro de um segmento) e ?. Variantes traduzidas (ex. README.de.md) são incluídas quando cobertas por um padrão como README.*.md.
workflow.readme-sync.param.maxToolRounds.description=Limite superior de rodadas de exploração/escrita do agente. Valores maiores permitem atualizações de documentação maiores a um custo maior de tokens.
workflow.readme-sync.param.suiteLifecycle.description=O que fazer com as alterações de documentação geradas.
workflow.unit-test-author.param.framework.description=Deixe em auto para detectar a cadeia de ferramentas a partir do repositório, ou fixe-a explicitamente.
workflow.unit-test-author.param.maxRetries.description=Quantas vezes reexecutar uma suíte com falha antes de reportá-la como falha (0-5).
workflow.unit-test-author.param.maxTestCases.description=Limite de custo — limitado a um máximo fixo independentemente do valor.
workflow.unit-test-author.param.suiteLifecycle.description=O que fazer com os testes gerados.
workflow.issue-triage.param.systemPrompt.description=Instruções de encaminhamento para o modelo de triagem. DEVE ser revisado antes do uso: verifique as descrições de função, nomes de conta e de bot, e certifique-se de que cada conta listada existe e é atribuível no provedor Git conectado. Mantenha os nomes de conta sincronizados com os responsáveis permitidos abaixo.
workflow.issue-triage.param.assignees.description=Nomes de conta separados por vírgula para os quais o fluxo pode atribuir issues. 'none' é sempre permitido e significa: publicar o motivo, mas deixar a issue não atribuída.
