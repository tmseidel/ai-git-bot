help.deploymentTarget.callbackUrl=Estratégias assíncronas (ex. <code>WEBHOOK</code>) devem chamar de volta o bot nesta URL quando o ambiente de visualização estiver pronto. Os marcadores <code>{runId}</code> e <code>{secret}</code> são preenchidos por requisição e incorporados na carga do webhook de saída como <code>callbackUrl</code>.
help.deploymentTarget.publicBaseUrl=Defina a propriedade <code>ai-git-bot.public-base-url</code> (ex. <code>https://bot.acme.io</code>) para que o bot possa fornecer uma URL totalmente qualificada.
