help.hook.url=Deve começar com <code>http://</code> ou <code>https://</code>. As entregas são enviadas por POST aqui com um corpo JSON; qualquer resposta 2xx conta como sucesso.
help.hook.eventTypes=Pelo menos um. O endpoint recebe cada evento marcado que corresponde ao seu escopo abaixo.
help.hook.customHeaders=Enviado com cada entrega. Deve ser um único objeto JSON. Armazenado criptografado quando APP_ENCRYPTION_KEY está configurada; deixe em branco ao editar para manter o valor atual.
help.hook.scope=Deixe os três vazios para um endpoint global que recebe eventos de todos os bots e repositórios.
