help.bot.systemPrompt=Selecione o conjunto de prompts usado para revisões de código, implementações do agente de codificação e fluxos do agente redator.
help.bot.mcpConfiguration=Ferramentas MCP remotas opcionais. Apenas as ferramentas selecionadas são expostas ao prompt.
help.bot.toolConfiguration=Lista de permissões de ferramentas de agente integradas (arquivo, contexto, validação, repositório) que este bot pode expor à IA. Apenas as ferramentas habilitadas são anunciadas ao modelo e executáveis em tempo de execução.
help.bot.workflowConfiguration=Quais fluxos são executados nos webhooks de pull request (revisões, geração de testes, ...). Deixe vazio para herdar o padrão (somente revisão). Selecione a configuração vazia "No PR workflows" para manter o bot silencioso nas PRs.
help.bot.runOnPrCreation=Quando ativado, o bot executa seu fluxo de PR configurado quando uma pull request é criada ou aberta, mesmo que não esteja atribuído como revisor.
help.bot.runOnPrUpdate=Quando ativado, o bot executa seu fluxo de PR configurado a cada evento <code>synchronized</code> (novos commits enviados à branch da PR). Compatível apenas com GitHub e Gitea. Instalações existentes vêm desativadas por padrão.
help.bot.issueWorkflow=O que este bot faz quando é atribuído a uma issue e como trata os comentários de acompanhamento (ex. o agente de codificação implementa, o agente redator refina). Independente da configuração de fluxo de PR acima.
help.bot.runOnIssueCreation=Quando ativado, o bot executa seu fluxo de issue configurado quando uma issue é criada, mesmo que não esteja atribuído a ela.
help.bot.deploymentTarget=Ambiente de visualização por PR usado por fluxos que precisam de implantação ao vivo (ex. testes E2E). Gerencie os alvos em
help.bot.userWhitelist=Nomes de usuário Git autorizados a acionar interações de IA pagas com este bot (aberturas/sincronizações de PR, <code>@</code>-menções, comentários em linha, trabalho de agente em issues). Um nome por linha ou separado por vírgula; a correspondência não diferencia maiúsculas. <strong>Deixe em branco para permitir todos</strong> (padrão histórico). Recomendado para <strong>repositórios públicos</strong> para que desconhecidos não consumam os tokens de IA do bot.
help.bot.webhookSigningSecret=Quando definido, o bot verifica a assinatura de webhook do provedor (<code>X-Hub-Signature-256</code> para GitHub, <code>X-Gitea-Signature</code> para Gitea, <code>X-Gitlab-Token</code> para GitLab, <code>X-Hub-Signature</code> para Bitbucket) e rejeita eventos falsificados. Configure o mesmo segredo nas configurações de webhook do provedor. Armazenado criptografado quando <code>APP_ENCRYPTION_KEY</code> está configurada. <strong>Altamente recomendado para repositórios públicos.</strong>
help.bot.aiIntegrationMissing=<strong>Integração de IA</strong> — conecta o bot a um provedor de IA (Anthropic, OpenAI, Google, ...).
help.bot.gitIntegrationMissing=<strong>Integração de Git</strong> — conecta o bot a uma plataforma Git (Gitea, GitHub, GitLab, ...).
popover.toolCalling.title=Modo de chamada de ferramentas
popover.toolCalling.content=<p><strong>Ativado (padrão, recomendado)</strong>: os descritores de ferramentas são enviados pela API nativa de chamada de função do provedor (Anthropic <code>tools</code>, OpenAI/Ollama <code>tool_calls</code>, Google <code>functionDeclarations</code>). O modelo retorna invocações de ferramenta estruturadas que o loop do agente despacha diretamente. É a rota recomendada para modelos de ponta — mais eficiente em tokens e mais confiável em fluxos agênticos.</p><p><strong>Desativado (fallback legado)</strong>: o catálogo de ferramentas é descrito no prompt do sistema e pede-se ao modelo responder com um bloco JSON que o agente analisa. Só recorra a isso se a chamada nativa não funcionar de forma confiável — ex. com modelos mais fracos/menores ou alguns backends auto-hospedados.</p><p>llama.cpp sempre roda em modo legado, independentemente deste interruptor. Veja <code>doc/TOOL_CALLING.md</code> para o guia completo de solução de problemas.</p>
popover.promptCaching.title=Cache de prompt
popover.promptCaching.content=<p><strong>Ativado (padrão, recomendado)</strong>: o cliente marca pontos de interrupção de cache no prompt do sistema e no final contínuo da conversa. Fluxos agênticos reenviam todo o prefixo do prompt (prompt do sistema + diff + todos os resultados de ferramentas anteriores) a cada rodada; com cache, prefixos repetidos são cobrados como leituras de cache a cerca de 1/10 do preço de entrada, em vez do preço total, reduzindo o custo de revisão a uma fração.</p><p><strong>Desativado</strong>: cada solicitação é cobrada pelo preço de entrada total. Só desative se o endpoint do provedor rejeitar o campo <code>cache_control</code>.</p><p>Atualmente, apenas o provedor Anthropic oferece suporte a cache de prompt; outros provedores ignoram este interruptor.</p>
help.ai.contextWindow=Tamanho total da janela de contexto do modelo. Usado para compactação proativa do histórico.
help.ai.toolCalling=Recomendado para modelos de ponta — a chamada de função nativa é o padrão e a rota mais eficiente em tokens e confiável em fluxos agênticos. Só desative para voltar ao sistema JSON-no-prompt legado se a chamada nativa falhar (ex. com modelos mais fracos ou alguns backends auto-hospedados).
help.ai.promptCaching=Apenas Anthropic Claude — prefixos de prompt em cache são cobrados a uma taxa muito menor, o que reduz substancialmente o custo das revisões agênticas. Ignorado por provedores sem API de cache.
