help.hook.keepSecret=Deixe em branco para manter o segredo atual.
help.hook.authorizationHeader=Valor de cabeçalho <code>Authorization</code> estático opcional, ex. <code>Bearer token123456</code> ou <code>Basic YWxhZGRpbjpvcGVuc2VzYW1l</code>.
