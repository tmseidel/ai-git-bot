help.deploymentTarget.previewUrlTemplate=Opcional. Obrigatório para <code>STATIC</code>; informativo para <code>WEBHOOK</code>. Marcadores: <code>{prNumber}</code>, <code>{sha}</code>, <code>{branch}</code>.
help.deploymentTarget.timeout=Tempo máximo que o orquestrador aguarda a estratégia / o callback.
help.deploymentTarget.strategyConfig=<strong>WEBHOOK</strong>: <code>{ "webhookUrl": "&lt;url&gt;", "sharedSecret": "&lt;hex&gt;", "headers": { ... } }</code>.<br/><strong>STATIC</strong>: <code>{ "healthcheckPath": "/healthz", "expectedStatus": 200, "intervalSeconds": 5, "extraHeaders": { ... } }</code>.<br/><strong>MCP</strong> <em>(experimental)</em>: <code>{ "mcpConfigurationId": &lt;id&gt;, "deployTool": "&lt;nome-qualificado&gt;", "statusTool": "&lt;nome-qualificado&gt;", "teardownTool": "&lt;nome-qualificado&gt;", "argsTemplate": { "branch": "{branch}", "sha": "{sha}" } }</code>. Todos os nomes de ferramentas devem estar na lista de permissões da configuração MCP referenciada — caso contrário, o salvamento é rejeitado.<br/><strong>CI_ACTION</strong>: <code>{ "workflowRef": "preview.yml", "refTemplate": "refs/heads/{branch}", "previewUrlOutput": "preview_url", "pollIntervalSeconds": 15, "inputs": { "callbackUrl": "{callbackUrl}" } }</code>. <code>workflowRef</code> é o arquivo de workflow (GitHub / Gitea Actions), o token de acionamento de pipeline (GitLab CI) ou o padrão de pipeline personalizado (Bitbucket Pipelines). <code>refTemplate</code> deve resolver para uma <em>branch ou tag</em> que já exista no remoto (padrão: <code>refs/heads/{branch}</code>) — Gitea, GitLab e Bitbucket rejeitam refs de pull request como <code>refs/pull/N/head</code> no momento do envio. GitHub Actions também é compatível com <code>refs/pull/{prNumber}/head</code> (necessário para PRs de fork). Veja <a href="https://github.com/tmseidel/ai-git-bot/blob/main/doc/PR_WORKFLOWS_CI_ACTIONS.md" target="_blank">doc/PR_WORKFLOWS_CI_ACTIONS.md</a> para uma receita por provedor.<br/>Veja <a href="https://github.com/tmseidel/ai-git-bot/blob/main/doc/PR_WORKFLOWS.md" target="_blank">doc/PR_WORKFLOWS.md → Deployment targets</a> para o esquema completo.
